<!DOCTYPE html>
<html lang="en">
<head>

<title>🎾 King Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(180deg,#0d0d1f 0%,#0a0a12 100%);color:#f0f0f0;min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:40px}
body::before{content:'';position:fixed;top:-100px;left:50%;transform:translateX(-50%);width:400px;height:300px;background:radial-gradient(circle,rgba(255,215,0,0.06) 0%,transparent 70%);pointer-events:none;z-index:0}
.screen{padding:16px;animation:fadeSlide 0.4s cubic-bezier(0.16,1,0.3,1) both;position:relative;z-index:1}
@keyframes fadeSlide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-20px)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes kingPop{0%{transform:scale(0) rotate(-15deg)}60%{transform:scale(1.25) rotate(4deg)}100%{transform:scale(1)}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 12px rgba(255,215,0,0.25),inset 0 0 0 2px rgba(255,215,0,0.6)}50%{box-shadow:0 0 28px rgba(255,215,0,0.55),inset 0 0 0 2px rgba(255,215,0,1)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}24%{transform:scale(1)}36%{transform:scale(1.04)}48%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes riseIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes glowIn{from{opacity:0;transform:scale(0.85)}to{opacity:1;transform:scale(1)}}
.btn{border:none;cursor:pointer;font-family:inherit;transition:transform 0.12s cubic-bezier(0.34,1.56,0.64,1),opacity 0.12s}
.btn:active{transform:scale(0.95);opacity:0.85}
.card{background:linear-gradient(145deg,#1e1e30,#191927);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.label{font-size:10px;font-weight:700;color:#8a8aa0;letter-spacing:1.2px;margin-bottom:8px}
.inp{background:#26263a;border:1px solid #3a3a55;border-radius:10px;color:#f0f0f0;font-size:16px;padding:10px 12px;width:100%;font-family:inherit}
.inp:focus{outline:none;border-color:#FFD700;box-shadow:0 0 0 3px rgba(255,215,0,0.15)}
canvas#cf{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;width:100%;height:100%}
#crown,#summary{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,5,12,0.92);z-index:9998;backdrop-filter:blur(6px)}
#confirm,#sModal,#eModal,#pModal{position:fixed;inset:0;background:rgba(5,5,12,0.8);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;overflow-y:auto;backdrop-filter:blur(4px)}
.mbox{background:linear-gradient(145deg,#1e1e30,#17172a);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:22px;width:100%;max-width:340px;margin:auto;box-shadow:0 12px 40px rgba(0,0,0,0.5);animation:glowIn 0.25s cubic-bezier(0.16,1,0.3,1) both}
.chip{padding:8px 14px;border-radius:10px;border:1px solid #3a3a55;background:#26263a;color:#f0f0f0;font-size:13px;cursor:pointer;font-family:inherit}
.mrow{display:flex;align-items:center;padding:8px 10px;background:linear-gradient(145deg,#1e1e30,#191927);border:1px solid rgba(255,255,255,0.05);border-radius:10px;margin-bottom:5px;cursor:pointer}
.tabb{padding:8px 12px;font-size:14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:#f0f0f0;cursor:pointer;font-family:inherit;transition:all 0.2s}
.tabb.on{background:linear-gradient(145deg,#2a2a42,#232338);font-weight:600;border-color:rgba(255,215,0,0.35);box-shadow:0 0 12px rgba(255,215,0,0.12)}
.seg{display:flex;background:#191927;border-radius:12px;padding:3px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.05)}
.sb{flex:1;padding:9px;border:none;border-radius:9px;background:transparent;color:#8a8aa0;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.25s}
.sb.on{background:linear-gradient(145deg,#2e2e48,#26263c);color:#f0f0f0;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.pchk{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:#26263a;border-radius:11px;margin-bottom:6px;cursor:pointer;transition:transform 0.12s}
.pchk:active{transform:scale(0.98)}
.gold-grad{background:linear-gradient(90deg,#FFD700,#FFA500,#FFD700);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite}
.kingpoint{animation:pulseGold 1.2s ease-in-out infinite}
.kp-banner{background:linear-gradient(90deg,rgba(255,215,0,0.15),rgba(255,165,0,0.2),rgba(255,215,0,0.15));border:1px solid rgba(255,215,0,0.5);color:#FFD700;font-weight:800;font-size:13px;letter-spacing:2px;padding:8px;border-radius:10px;text-align:center;margin-bottom:12px;animation:heartbeat 1.4s ease-in-out infinite}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:16px}
.pod{border-radius:14px 14px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 6px;animation:riseIn 0.5s both}
.pod-1{background:linear-gradient(180deg,rgba(255,215,0,0.22),rgba(255,215,0,0.06));border:1px solid rgba(255,215,0,0.45);box-shadow:0 0 24px rgba(255,215,0,0.2)}
.pod-2{background:linear-gradient(180deg,rgba(200,200,215,0.14),rgba(200,200,215,0.04));border:1px solid rgba(200,200,215,0.3)}
.pod-3{background:linear-gradient(180deg,rgba(205,127,50,0.16),rgba(205,127,50,0.05));border:1px solid rgba(205,127,50,0.35)}
</style>
</head>

<div style="padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;position:relative;z-index:1">
  <div>
    <div style="font-size:22px;font-weight:800"><span class="gold-grad">🎾 King Tracker</span></div>

<script>
var SK='tkv8_s', PK='tkv8_p', LK='tkv8_l';
var FC={Set:'#4ECDC4',TB:'#FF9F43',STB:'#FFD700'};
var FL={Set:'Full Set',TB:'Tiebreak (7)',STB:'Super TB (10)'};

var SEED=[
{date:'2026-07-06',players:['Jason','Eric','Minjun'],mode:'king',thresh:2,amt:10,fmt:'STB',loggedBy:'Jason',matches:[],kings:{Jason:1,Eric:0,Minjun:1}},
{date:'2026-06-29',players:['Jason','Eric','Minjun'],mode:'king',thresh:2,amt:10,fmt:'STB',loggedBy:'Jason',matches:[
{type:'singles',p1:'Jason',p2:'Eric',score1:5,score2:10,winner:'Eric',loser:'Jason',fmt:'STB'},
{type:'singles',p1:'Eric',p2:'Minjun',score1:9,score2:11,winner:'Minjun',loser:'Eric',fmt:'STB'},
{type:'singles',p1:'Minjun',p2:'Jason',score1:10,score2:3,winner:'Minjun',loser:'Jason',fmt:'STB'},
{type:'singles',p1:'Jason',p2:'Eric',score1:10,score2:5,winner:'Jason',loser:'Eric',fmt:'STB'},
{type:'singles',p1:'Jason',p2:'Minjun',score1:10,score2:6,winner:'Jason',loser:'Minjun',fmt:'STB'},
{type:'singles',p1:'Minjun',p2:'Eric',score1:10,score2:7,winner:'Minjun',loser:'Eric',fmt:'STB'},
{type:'singles',p1:'Minjun',p2:'Jason',score1:6,score2:10,winner:'Jason',loser:'Minjun',fmt:'STB'},
{type:'singles',p1:'Jason',p2:'Eric',score1:10,score2:7,winner:'Jason',loser:'Eric',fmt:'STB'},
{type:'singles',p1:'Eric',p2:'Minjun',score1:13,score2:11,winner:'Eric',loser:'Minjun',fmt:'STB'},
{type:'singles',p1:'Eric',p2:'Jason',score1:10,score2:7,winner:'Eric',loser:'Jason',fmt:'STB'}
],kings:{Jason:2,Eric:1,Minjun:1}}
];

var G={
  sessions:[],allPlayers:['Jason','Eric','Minjun','KL'],
  activePlayers:['Jason','Eric','Minjun','KL'],
  mode:'king',thresh:3,amt:0,fmt:'STB',loggedBy:'Jason',
  newP:'',session:null,
  sc1:'',sc2:'',mfmt:'STB',sWinIdx:-1,
  mtype:'singles',p1i:-1,p2i:-1,tA:[],tB:[],winT:null,
  ei:null,eSc1:'',eSc2:'',eWi:-1,eFmt:'STB',eWinT:'',
  screen:'home',statP:null,htab:'kings',stab:'singles',lastEnded:null
};

function ld(){
  try{var d=localStorage.getItem(SK);if(d)G.sessions=JSON.parse(d);}catch(e){}
  if(!G.sessions||G.sessions.length===0){G.sessions=JSON.parse(JSON.stringify(SEED));try{localStorage.setItem(SK,JSON.stringify(G.sessions));}catch(e){}}
  try{var p=localStorage.getItem(PK);if(p){G.allPlayers=JSON.parse(p);G.activePlayers=G.allPlayers.slice(0,4);G.loggedBy=G.allPlayers[0];}}catch(e){}
  try{var l=localStorage.getItem(LK);if(l){var ls=JSON.parse(l);if(ls)G.session=ls;}}catch(e){}
}
function sv(){try{localStorage.setItem(SK,JSON.stringify(G.sessions));}catch(e){}}
function svP(){try{localStorage.setItem(PK,JSON.stringify(G.allPlayers));}catch(e){}}
function svL(){try{if(G.session)localStorage.setItem(LK,JSON.stringify(G.session));else localStorage.removeItem(LK);}catch(e){}}
function clL(){try{localStorage.removeItem(LK);}catch(e){}}

function rebuild(players,matches,thresh){
  var streaks={},kings={},queue=players.slice(),onCourt;
  players.forEach(function(p){streaks[p]=0;kings[p]=0;});
  onCourt=[queue.shift(),queue.shift()];
  matches.forEach(function(m){
    var w=m.winner,l=m.loser;
    streaks[l]=0;streaks[w]=(streaks[w]||0)+1;
    var c=false;
    if(streaks[w]>=thresh){kings[w]=(kings[w]||0)+1;streaks[w]=0;c=true;}
    queue.push(l);
    if(c){queue.push(w);onCourt=[queue.shift(),queue.shift()];}
    else{onCourt=[w,queue.shift()];}
  });
  return{streaks:streaks,kings:kings,queue:queue,onCourt:onCourt};
}
function pairKey(a,b){return [a,b].sort().join('|');}
function ast(){
  var st={};
  function en(p){if(!st[p])st[p]={kings:0,sW:0,sL:0,sPf:0,sPa:0,dW:0,dL:0,h2h:{},pairs:{}};}
  G.sessions.forEach(function(s){
    s.players.forEach(function(p){en(p);if(s.mode==='king')st[p].kings+=(s.kings[p]||0);});
    (s.matches||[]).forEach(function(m){
      if(m.type==='doubles'){
        var wt=m.winTeam==='A'?m.tA:m.tB,lt=m.winTeam==='A'?m.tB:m.tA;
        wt.forEach(function(p){en(p);st[p].dW++;});
        lt.forEach(function(p){en(p);st[p].dL++;});
        if(wt.length===2){var k=pairKey(wt[0],wt[1]);wt.forEach(function(p){if(!st[p].pairs[k])st[p].pairs[k]={partner:wt.filter(function(x){return x!==p;})[0],w:0,l:0};st[p].pairs[k].w++;});}
        if(lt.length===2){var k2=pairKey(lt[0],lt[1]);lt.forEach(function(p){if(!st[p].pairs[k2])st[p].pairs[k2]={partner:lt.filter(function(x){return x!==p;})[0],w:0,l:0};st[p].pairs[k2].l++;});}
      }else{
        var w=m.winner,l=m.loser;en(w);en(l);
        st[w].sW++;st[l].sL++;
        var ws=m.winner===m.p1?m.score1:m.score2,ls=m.winner===m.p1?m.score2:m.score1;
        st[w].sPf+=ws;st[w].sPa+=ls;st[l].sPf+=ls;st[l].sPa+=ws;
        if(!st[w].h2h[l])st[w].h2h[l]={w:0,l:0,pf:0,pa:0};
        if(!st[l].h2h[w])st[l].h2h[w]={w:0,l:0,pf:0,pa:0};
        st[w].h2h[l].w++;st[w].h2h[l].pf+=ws;st[w].h2h[l].pa+=ls;
        st[l].h2h[w].l++;st[l].h2h[w].pf+=ls;st[l].h2h[w].pa+=ws;
      }
    });
  });
  return st;
}
function settle(kings,players,amt){
  if(!amt)return[];
  var res=[];
  players.forEach(function(e){
    var ek=kings[e]||0;if(!ek)return;
    players.forEach(function(p){
      if(p===e)return;
      var net=(ek-(kings[p]||0))*amt;
      if(net>0)res.push({from:p,to:e,amount:net});
    });
  });
  var map={};
  res.forEach(function(r){
    var ab=[r.from,r.to].sort(),k=ab[0]+'|'+ab[1];
    if(!map[k])map[k]={a:ab[0],b:ab[1],net:0};
    map[k].net+=r.to===ab[1]?r.amount:-r.amount;
  });
  var out=[];
  Object.keys(map).forEach(function(k){
    var x=map[k];
    if(x.net>0)out.push({from:x.a,to:x.b,amount:x.net});
    else if(x.net<0)out.push({from:x.b,to:x.a,amount:-x.net});
  });
  return out;
}

var cfF=null;
function showCf(){
  var c=document.getElementById('cf');c.style.display='block';
  c.width=window.innerWidth;c.height=window.innerHeight;
  var ctx=c.getContext('2d');
  var cols=['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#FF9F43'];
  var ps=[];
  for(var i=0;i<100;i++)ps.push({x:Math.random()*c.width,y:Math.random()*-250,r:Math.random()*9+4,color:cols[Math.floor(Math.random()*cols.length)],vx:(Math.random()-.5)*5,vy:Math.random()*5+2,rot:Math.random()*360,vrot:(Math.random()-.5)*12});
  if(cfF)cancelAnimationFrame(cfF);
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(function(q){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot*Math.PI/180);ctx.fillStyle=q.color;ctx.fillRect(-q.r/2,-q.r/2,q.r,q.r);ctx.restore();q.x+=q.vx;q.y+=q.vy;q.rot+=q.vrot;if(q.y>c.height){q.y=-20;q.x=Math.random()*c.width;}});
    cfF=requestAnimationFrame(draw);
  }
  draw();
  setTimeout(function(){cancelAnimationFrame(cfF);c.style.display='none';},3500);
}
function showCrown(name,cb){
  var el=document.getElementById('crown');el.style.display='flex';
  var ems=['🎾','🔥','💪','🏆','🥇'].map(function(e,i){return '<span style="font-size:30px;animation:pop 0.3s '+(i*0.1)+'s both">'+e+'</span>';}).join('');
  el.innerHTML='<div style="font-size:92px;animation:bounce 0.45s infinite alternate;filter:drop-shadow(0 0 30px rgba(255,215,0,0.6))">👑</div><div style="font-size:32px;font-weight:900;margin-top:14px" class="gold-grad">'+name+'</div><div style="color:#fff;font-size:19px;margin-top:6px;letter-spacing:3px">IS THE KING!</div><div style="margin-top:18px;display:flex;gap:12px">'+ems+'</div><div style="color:#666;font-size:13px;margin-top:20px">stepping off court...</div>';
  showCf();
  setTimeout(function(){el.style.display='none';if(cb)cb();},2800);
}
function showConfirm(msg,onYes){
  var el=document.getElementById('confirm');el.style.display='flex';
  el.innerHTML='<div class="mbox" style="text-align:center"><div style="font-size:15px;margin-bottom:20px;line-height:1.5">'+msg+'</div><div style="display:flex;gap:8px"><button class="btn" onclick="hid(\'confirm\')" style="flex:1;padding:12px;border-radius:10px;border:1px solid #3a3a55;background:transparent;color:#8a8aa0;font-size:14px">Cancel</button><button class="btn" id="cy" style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#E24B4A,#c73837);color:#fff;font-weight:700;font-size:14px">Yes</button></div></div>';
  document.getElementById('cy').onclick=function(){el.style.display='none';onYes();};
}
function hid(id){document.getElementById(id).style.display='none';}

function cnt(id,target,suffix){
  var el=document.getElementById(id);if(!el)return;
  var dur=900,t0=null;
  function step(t){
    if(!t0)t0=t;
    var p=Math.min((t-t0)/dur,1);
    el.textContent=Math.round(target*(1-Math.pow(1-p,3)))+(suffix||'');
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function go(name){
  ['home','setup','session','history','stats','players'].forEach(function(s){document.getElementById('s-'+s).style.display='none';});
  var scr=document.getElementById('s-'+name);
  scr.style.display='block';
  scr.style.animation='none';scr.offsetHeight;scr.style.animation='';
  ['home','history','stats','players'].forEach(function(s){var t=document.getElementById('t-'+s);if(t)t.classList.toggle('on',s===name);});
  G.screen=name;
  if(name==='home')rHome();
  else if(name==='setup')rSetup();
  else if(name==='session')rSession();
  else if(name==='history')rHistory();
  else if(name==='stats'){G.statP=null;G.stab='singles';rStats();}
  else if(name==='players')rPlayers();
}

function medalEmoji(i){return i===0?'👑':i===1?'🥈':i===2?'🥉':(i+1)+'.';}

function rHome(){
  var el=document.getElementById('s-home');
  var a=ast();
  var isKingsTab=G.htab==='kings';
  var ranked;
  if(isKingsTab){
    ranked=Object.keys(a).filter(function(p){return a[p].kings>0||((a[p].sW+a[p].sL)>0);}).sort(function(x,y){return (a[y].kings||0)-(a[x].kings||0);});
  }else{
    ranked=Object.keys(a).filter(function(p){return (a[p].sW||0)+(a[p].sL||0)>0;}).sort(function(x,y){
      var tx=(a[x].sW||0)+(a[x].sL||0),ty=(a[y].sW||0)+(a[y].sL||0);
      return (a[y].sW/ty)-(a[x].sW/tx);
    });
  }
  var podHtml='';
  if(ranked.length>=2){
    var order=[1,0,2].filter(function(i){return i<ranked.length;});
    var heights={0:96,1:74,2:60};
    podHtml='<div class="podium">'+order.map(function(i){
      var p=ranked[i],s=a[p];
      var val=isKingsTab?(s.kings||0):((function(){var t=(s.sW||0)+(s.sL||0);return t>0?Math.round(100*s.sW/t):0;})());
      var sfx=isKingsTab?'':'%';
      var col=isKingsTab?'#FFD700':'#4ECDC4';
      return '<div class="pod pod-'+(i+1)+'" style="width:31%;min-height:'+(heights[i]+50)+'px;animation-delay:'+(i*0.12)+'s"><div style="font-size:'+(i===0?30:22)+'px;margin-bottom:4px">'+medalEmoji(i)+'</div><div style="font-weight:800;font-size:'+(i===0?16:13)+'px">'+p+'</div><div style="font-size:'+(i===0?26:19)+'px;font-weight:900;color:'+col+'" id="pod'+i+'">0</div><div style="font-size:9px;color:#8a8aa0;letter-spacing:1px">'+(isKingsTab?'KINGS':'WIN RATE')+'</div></div>';
    }).join('')+'</div>';
    setTimeout(function(){
      order.forEach(function(i){
        var p=ranked[i],s=a[p];
        var val=isKingsTab?(s.kings||0):((function(){var t=(s.sW||0)+(s.sL||0);return t>0?Math.round(100*s.sW/t):0;})());
        cnt('pod'+i,val,isKingsTab?'':'%');
      });
    },100);
  }
  var restList=ranked.slice(3).map(function(p,i){
    var s=a[p],tot=(s.sW||0)+(s.sL||0),pct=tot>0?Math.round(100*s.sW/tot):0;

function togAct(i){
  var p=G.allPlayers[i],idx=G.activePlayers.indexOf(p);

function startSess(){
  if(G.activePlayers.length<(G.mode==='king'?3:2))return;

    var q=players.slice(),p1=q.shift(),p2=q.shift();
    var st={},k={};players.forEach(function(p){st[p]=0;k[p]=0;});
    G.session={date:new Date().toISOString().slice(0,10),players:players,mode:'king',thresh:G.thresh,amt:G.amt,fmt:G.fmt,loggedBy:G.loggedBy,queue:q,onCourt:[p1,p2],matches:[],streaks:st,kings:k};
  }else{
    G.session={date:new Date().toISOString().slice(0,10),players:players,mode:'normal',fmt:G.fmt,loggedBy:G.loggedBy,matches:[]};

function confKing(){
  hid('sModal');
  var s=G.session,w=s.onCourt[G.sWinIdx],l=s.onCourt[1-G.sWinIdx];
  var p1=s.onCourt[0],p2=s.onCourt[1];
  var wsc=parseInt(G.sc1)||0,lsc=parseInt(G.sc2)||0;
  var s1=w===p1?wsc:lsc,s2=w===p1?lsc:wsc;
  var prevK={};Object.keys(s.kings).forEach(function(p){prevK[p]=s.kings[p];});
  s.matches.push({type:'singles',p1:p1,p2:p2,winner:w,loser:l,score1:s1,score2:s2,fmt:G.mfmt});
  var r=rebuild(s.players,s.matches,s.thresh);
  s.streaks=r.streaks;s.kings=r.kings;s.queue=r.queue;s.onCourt=r.onCourt;
  G.session=s;svL();
  var crowned=null;
  Object.keys(s.kings).forEach(function(p){if((s.kings[p]||0)>(prevK[p]||0))crowned=p;});
  if(crowned)showCrown(crowned,rSession);else rSession();
}

function pickP1(i){G.p1i=i;if(G.p2i===i)G.p2i=-1;G.sWinIdx=-1;rPM();}
function pickP2(i){G.p2i=i;G.sWinIdx=-1;rPM();}
function setPMW(i){G.sWinIdx=i;rPM();}
function setPMF(f){G.mfmt=f;rPM();}
function togT(t,i){

    el.innerHTML='<div style="font-size:17px;font-weight:800;margin-bottom:14px">📊 Player Stats</div>'+players.map(function(p,i){
      var s=a[p],tot=(s.sW||0)+(s.sL||0),pct=tot>0?Math.round(100*s.sW/tot):0,dtot=(s.dW||0)+(s.dL||0),dpct=dtot>0?Math.round(100*s.dW/dtot):0;
      return '<button class="btn" onclick="viewStat('+i+')" style="width:100%;display:flex;align-items:center;background:linear-gradient(145deg,#1e1e30,#191927);border:1px solid rgba(255,255,255,0.06);border-radius:13px;padding:13px 14px;margin-bottom:8px;text-align:left"><span style="font-size:21px;margin-right:12px">'+medalEmoji(i)+'</span><div style="flex:1"><div style="font-weight:700;font-size:15px;color:#f0f0f0">'+p+'</div><div style="font-size:11px;color:#8a8aa0;margin-top:2px">Singles: '+s.sW+'W '+s.sL+'L · '+pct+'%'+(dtot>0?' · Dbls: '+dpct+'%':'')+'</div></div><div style="text-align:right"><div style="font-size:19px;font-weight:900;color:#FFD700;line-height:1">'+s.kings+'👑</div><div style="font-size:11px;color:#4ECDC4;font-weight:700">'+pct+'%</div></div></button>';
    }).join('');
    G._statList=players;
  }else{
    var p=G.statP,s=a[p]||{kings:0,sW:0,sL:0,sPf:0,sPa:0,dW:0,dL:0,h2h:{},pairs:{}};
    var stot=(s.sW||0)+(s.sL||0),spct=stot>0?Math.round(100*s.sW/stot):0;
    var dtot=(s.dW||0)+(s.dL||0),dpct=dtot>0?Math.round(100*s.dW/dtot):0;
    var rivals=Object.keys(s.h2h||{}),pairs=Object.keys(s.pairs||{});
    var sT=G.stab==='singles';
    var h2hH=rivals.length===0?'<div style="color:#666;font-size:13px;text-align:center;margin:16px 0">No singles data yet.</div>':rivals.map(function(opp,i){
      var h=s.h2h[opp],ht=(h.w||0)+(h.l||0),hp=ht>0?Math.round(100*h.w/ht):0;
      var dom=hp>=60?'<span style="background:linear-gradient(135deg,#FF6B6B,#e0504f);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;margin-left:6px">DOMINANT 🔥</span>':'';
      return '<div class="card" style="animation:riseIn 0.4s '+(i*0.08)+'s both"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-weight:700;font-size:14px">'+p+' vs '+opp+'</div>'+dom+'</div><div style="height:8px;border-radius:5px;background:#26263a;overflow:hidden;margin-bottom:6px"><div style="height:100%;width:'+hp+'%;background:linear-gradient(90deg,#4ECDC4,#3aa89f);border-radius:5px;transition:width 0.9s cubic-bezier(0.16,1,0.3,1)"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#8a8aa0"><span style="color:#4ECDC4;font-weight:800">'+h.w+'W '+h.l+'L ('+hp+'%)</span><span>Pts: '+h.pf+'–'+h.pa+'</span></div></div>';
    }).join('');
    var pairH=pairs.length===0?'<div style="color:#666;font-size:13px;text-align:center;margin:16px 0">No doubles data yet.</div>':pairs.map(function(k,i){
      var pr=s.pairs[k],pt=(pr.w||0)+(pr.l||0),pp2=pt>0?Math.round(100*pr.w/pt):0;
      var dom=pp2>=60?'<span style="background:linear-gradient(135deg,#FF9F43,#e8842a);color:#0d0d1f;font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;margin-left:6px">DREAM TEAM 🤝</span>':'';
      return '<div class="card" style="animation:riseIn 0.4s '+(i*0.08)+'s both"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-weight:700;font-size:14px">'+p+' &amp; '+pr.partner+'</div>'+dom+'</div><div style="height:8px;border-radius:5px;background:#26263a;overflow:hidden;margin-bottom:6px"><div style="height:100%;width:'+pp2+'%;background:linear-gradient(90deg,#FF9F43,#e8842a);border-radius:5px;transition:width 0.9s"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#8a8aa0"><span style="color:#FF9F43;font-weight:800">'+pr.w+'W '+pr.l+'L ('+pp2+'%)</span><span>'+pt+' matches</span></div></div>';
    }).join('');
    el.innerHTML='<button class="btn" onclick="G.statP=null;rStats()" style="background:none;border:none;color:#8a8aa0;font-size:13px;margin-bottom:12px;padding:0">← All Players</button>'
    +'<div style="background:linear-gradient(145deg,#12121f,#0e0e1a);border:1px solid rgba(255,215,0,0.2);border-radius:18px;padding:22px;margin-bottom:14px;text-align:center;box-shadow:0 0 30px rgba(255,215,0,0.08)"><div style="font-size:50px;margin-bottom:6px;animation:kingPop 0.5s both;filter:drop-shadow(0 0 16px rgba(255,215,0,0.4))">👑</div><div style="font-size:26px;font-weight:900;margin-bottom:12px" class="gold-grad">'+p+'</div><div style="display:flex;justify-content:center;gap:18px"><div style="text-align:center"><div style="font-size:21px;font-weight:900;color:#FFD700" id="stK">0</div><div style="font-size:10px;color:#8a8aa0">KINGS</div></div><div style="text-align:center"><div style="font-size:21px;font-weight:900;color:#4ECDC4" id="stS">0</div><div style="font-size:10px;color:#8a8aa0">SINGLES</div></div><div style="text-align:center"><div style="font-size:21px;font-weight:900;color:#FF9F43" id="stD">0</div><div style="font-size:10px;color:#8a8aa0">DOUBLES</div></div><div style="text-align:center"><div style="font-size:21px;font-weight:900;color:#f0f0f0" id="stT">0</div><div style="font-size:10px;color:#8a8aa0">TOTAL</div></div></div></div>'
    +'<div class="seg"><button class="sb '+(sT?'on':'')+'" onclick="G.stab=\'singles\';rStats()">🎾 Singles</button><button class="sb '+(!sT?'on':'')+'" onclick="G.stab=\'doubles\';rStats()">🤝 Doubles</button></div>'
    +(sT?'<div class="label">HEAD-TO-HEAD (SINGLES)</div>'+h2hH:'<div class="label">PARTNERSHIP RECORDS (DOUBLES)</div>'+pairH);
    setTimeout(function(){cnt('stK',s.kings);cnt('stS',spct,'%');cnt('stD',dpct,'%');cnt('stT',stot+dtot);},80);
  }
}
function viewStat(i){G.statP=G._statList[i];G.stab='singles';rStats();}

function rPlayers(){
  var el=document.getElementById('s-players');
  el.innerHTML='<div style="font-size:17px;font-weight:800;margin-bottom:14px">👥 Player List</div><div class="card">'+G.allPlayers.map(function(p,i){return '<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.06)"><span style="font-weight:500;font-size:14px">'+p+'</span>'+(G.allPlayers.length>2?'<button class="btn" onclick="remP('+i+')" style="background:none;border:none;color:#E24B4A;font-size:20px;padding:0 6px">×</button>':'')+'</div>';}).join('')+'<div style="display:flex;gap:8px;margin-top:12px"><input class="inp" id="npg" placeholder="New player name" value="'+G.newP+'" oninput="G.newP=this.value" onkeydown="if(event.key===\'Enter\')addP()" style="flex:1"/><button class="btn" onclick="addP()" style="padding:10px 15px;border-radius:10px;border:1px solid #3a3a55;background:#26263a;color:#f0f0f0;font-size:16px;font-weight:800">+</button></div></div>'
  +'<div style="font-size:12px;color:#666;text-align:center;margin:8px 0 16px">Players are permanent · stats build over time</div>'
  +'<div class="card"><div class="label">💾 DATA BACKUP</div><div style="display:flex;gap:8px"><button class="btn" onclick="expData()" style="flex:1;padding:11px;border-radius:10px;border:1px solid #4ECDC4;background:transparent;color:#4ECDC4;font-weight:700;font-size:13px">⬇️ Export</button><button class="btn" onclick="document.getElementById(\'impFile\').click()" style="flex:1;padding:11px;border-radius:10px;border:1px solid #FF9F43;background:transparent;color:#FF9F43;font-weight:700;font-size:13px">⬆️ Import</button></div><div style="font-size:11px;color:#666;margin-top:8px;text-align:center">Export saves a backup file · Import restores it on any device</div></div>';
}
function addP(){var n=(G.newP||'').trim();if(!n||G.allPlayers.indexOf(n)>=0)return;G.allPlayers.push(n);G.newP='';svP();rPlayers();}
function remP(i){
  var p=G.allPlayers[i];
  showConfirm('Remove '+p+'? Stats stay in history.',function(){
    G.allPlayers.splice(i,1);
    var ai=G.activePlayers.indexOf(p);
    if(ai>=0)G.activePlayers.splice(ai,1);
    svP();rPlayers();
  });
}

function expData(){
  var data=JSON.stringify({sessions:G.sessions,players:G.allPlayers},null,2);
  var blob=new Blob([data],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='king-tracker-backup.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function impData(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(d.sessions){
        showConfirm('Restore backup? This replaces current data.',function(){
          G.sessions=d.sessions;
          if(d.players){G.allPlayers=d.players;G.activePlayers=G.allPlayers.slice(0,4);}
          sv();svP();go('home');
        });
      }
    }catch(e){alert('Invalid backup file');}
  };
  r.readAsText(f);
  inp.value='';
}

ld();
if(G.session){G.mfmt=G.session.fmt||'STB';go('session');}
else go('home');
</script>
</body>
</html>
