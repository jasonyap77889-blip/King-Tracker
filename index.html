<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="King Tracker"/>
<title>🎾 King Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f1a;color:#f0f0f0;min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:40px}
.screen{padding:16px;animation:slideUp 0.3s both}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-20px)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes kingPop{0%{transform:scale(0) rotate(-15deg)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.btn{border:none;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
.btn:active{opacity:0.7}
.card{background:#1e1e2e;border:1px solid #2e2e4e;border-radius:14px;padding:14px;margin-bottom:10px}
.label{font-size:10px;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:8px}
.inp{background:#2a2a3e;border:1px solid #3e3e5e;border-radius:10px;color:#f0f0f0;font-size:16px;padding:10px 12px;width:100%;font-family:inherit}
.inp:focus{outline:none;border-color:#FFD700}
canvas#cf{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;width:100%;height:100%}
#crown{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.88);z-index:9998}
#confirm,#sModal,#eModal,#pModal{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;overflow-y:auto}
.mbox{background:#1e1e2e;border-radius:16px;padding:22px;width:100%;max-width:340px;margin:auto}
.chip{padding:8px 14px;border-radius:10px;border:1px solid #3e3e5e;background:#2a2a3e;color:#f0f0f0;font-size:13px;cursor:pointer;font-family:inherit}
.chip:active{opacity:0.7}
.mrow{display:flex;align-items:center;padding:7px 10px;background:#1e1e2e;border:1px solid #2e2e4e;border-radius:8px;margin-bottom:4px;cursor:pointer}
.mrow:active{opacity:0.7}
.tb{padding:7px 11px;font-size:13px;border-radius:8px;border:1px solid #3e3e5e;background:transparent;color:#f0f0f0;cursor:pointer;font-family:inherit}
.tb.on{background:#2a2a3e;font-weight:600}
.seg{display:flex;background:#1e1e2e;border-radius:10px;padding:3px;margin-bottom:14px}
.sb{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#888;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.2s}
.sb.on{background:#2a2a3e;color:#f0f0f0}
.pchk{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#2a2a3e;border-radius:10px;margin-bottom:6px;cursor:pointer}
.pchk:active{opacity:0.7}
</style>
</head>
<body>
<canvas id="cf" style="display:none"></canvas>
<div id="crown" style="display:none"></div>
<div id="confirm" style="display:none"></div>
<div id="sModal" style="display:none"></div>
<div id="eModal" style="display:none"></div>
<div id="pModal" style="display:none"></div>

<div style="padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
  <div>
    <div style="font-size:21px;font-weight:700">🎾 King Tracker</div>
    <div style="font-size:11px;color:#888">Monday Tennis</div>
  </div>
  <div style="display:flex;gap:6px">
    <button class="tb" id="t-home" onclick="go('home')">🏠</button>
    <button class="tb" id="t-history" onclick="go('history')">📅</button>
    <button class="tb" id="t-stats" onclick="go('stats')">📊</button>
    <button class="tb" id="t-players" onclick="go('players')">👥</button>
  </div>
</div>

<div id="s-home" class="screen"></div>
<div id="s-setup" class="screen" style="display:none"></div>
<div id="s-session" class="screen" style="display:none"></div>
<div id="s-history" class="screen" style="display:none"></div>
<div id="s-stats" class="screen" style="display:none"></div>
<div id="s-players" class="screen" style="display:none"></div>

<script>
var SK='tkv7_s', PK='tkv7_p', LK='tkv7_l';
var FC={Set:'#4ECDC4',TB:'#FF9F43',STB:'#FFD700'};
var FL={Set:'Full Set',TB:'Tiebreak (7)',STB:'Super TB (10)'};

var G={
  sessions:[], allPlayers:['Jason','Eric','Minjun','KL'],
  activePlayers:['Jason','Eric','Minjun','KL'],
  mode:'king', thresh:3, amt:0, fmt:'STB', loggedBy:'Jason',
  newP:'', session:null,
  sc1:'', sc2:'', mfmt:'STB', sModal:null,
  mtype:'singles', p1:null, p2:null, tA:[], tB:[], winT:null,
  ei:null, eSc1:'', eSc2:'', eW:'', eFmt:'STB', eWinT:'',
  screen:'home', statP:null, htab:'kings', stab:'singles'
};

function ld(){
  try{var d=localStorage.getItem(SK);if(d)G.sessions=JSON.parse(d);}catch(e){}
  try{var p=localStorage.getItem(PK);if(p){G.allPlayers=JSON.parse(p);G.activePlayers=G.allPlayers.slice(0,4);G.loggedBy=G.allPlayers[0];}}catch(e){}
  try{var l=localStorage.getItem(LK);if(l){var ls=JSON.parse(l);if(ls)G.session=ls;}}catch(e){}
}
function sv(){try{localStorage.setItem(SK,JSON.stringify(G.sessions));}catch(e){}}
function svP(){try{localStorage.setItem(PK,JSON.stringify(G.allPlayers));}catch(e){}}
function svL(){try{if(G.session)localStorage.setItem(LK,JSON.stringify(G.session));else localStorage.removeItem(LK);}catch(e){}}
function clL(){try{localStorage.removeItem(LK);}catch(e){}}

function rebuild(players, matches, thresh){
  var streaks={}, kings={}, queue=players.slice(), onCourt;
  players.forEach(function(p){streaks[p]=0;kings[p]=0;});
  onCourt=[queue.shift(),queue.shift()];
  matches.forEach(function(m){
    var w=m.winner, l=m.loser;
    streaks[l]=0; streaks[w]=(streaks[w]||0)+1;
    var crowned=false;
    if(streaks[w]>=thresh){kings[w]=(kings[w]||0)+1;streaks[w]=0;crowned=true;}
    queue.push(l);
    if(crowned){queue.push(w);onCourt=[queue.shift(),queue.shift()];}
    else{onCourt=[w,queue.shift()];}
  });
  return{streaks:streaks,kings:kings,queue:queue,onCourt:onCourt};
}

function pairKey(a,b){return [a,b].sort().join('|');}

function ast(){
  var stats={};
  function ensure(p){if(!stats[p])stats[p]={kings:0,sW:0,sL:0,sPf:0,sPa:0,dW:0,dL:0,h2h:{},pairs:{}};}
  G.sessions.forEach(function(s){
    s.players.forEach(function(p){ensure(p);if(s.mode==='king')stats[p].kings+=(s.kings[p]||0);});
    (s.matches||[]).forEach(function(m){
      if(m.type==='doubles'){
        var wt=m.winTeam==='A'?m.tA:m.tB;
        var lt=m.winTeam==='A'?m.tB:m.tA;
        wt.forEach(function(p){ensure(p);stats[p].dW++;});
        lt.forEach(function(p){ensure(p);stats[p].dL++;});
        if(wt.length===2){var k=pairKey(wt[0],wt[1]);wt.forEach(function(p){if(!stats[p].pairs[k])stats[p].pairs[k]={partner:wt.find(function(x){return x!==p;}),w:0,l:0};stats[p].pairs[k].w++;});}
        if(lt.length===2){var k2=pairKey(lt[0],lt[1]);lt.forEach(function(p){if(!stats[p].pairs[k2])stats[p].pairs[k2]={partner:lt.find(function(x){return x!==p;}),w:0,l:0};stats[p].pairs[k2].l++;});}
      } else {
        var w=m.winner, l=m.loser; ensure(w); ensure(l);
        stats[w].sW++; stats[l].sL++;
        var ws=m.winner===m.p1?m.score1:m.score2, ls=m.winner===m.p1?m.score2:m.score1;
        stats[w].sPf+=ws; stats[w].sPa+=ls; stats[l].sPf+=ls; stats[l].sPa+=ws;
        if(!stats[w].h2h[l])stats[w].h2h[l]={w:0,l:0,pf:0,pa:0};
        if(!stats[l].h2h[w])stats[l].h2h[w]={w:0,l:0,pf:0,pa:0};
        stats[w].h2h[l].w++; stats[w].h2h[l].pf+=ws; stats[w].h2h[l].pa+=ls;
        stats[l].h2h[w].l++; stats[l].h2h[w].pf+=ls; stats[l].h2h[w].pa+=ws;
      }
    });
  });
  return stats;
}

function settle(kings, players, amt){
  if(!amt) return [];
  var res=[];
  players.forEach(function(e){
    var ek=kings[e]||0; if(!ek) return;
    players.forEach(function(p){
      if(p===e) return;
      var net=(ek-(kings[p]||0))*amt;
      if(net>0) res.push({from:p,to:e,amount:net});
    });
  });
  var map={};
  res.forEach(function(r){
    var ab=[r.from,r.to].sort(), k=ab[0]+'|'+ab[1];
    if(!map[k]) map[k]={a:ab[0],b:ab[1],net:0};
    map[k].net+=r.to===ab[1]?r.amount:-r.amount;
  });
  return Object.values(map).filter(function(x){return x.net!==0;}).map(function(x){
    return x.net>0?{from:x.a,to:x.b,amount:x.net}:{from:x.b,to:x.a,amount:-x.net};
  });
}

// confetti
var cfF=null;
function showCf(){
  var c=document.getElementById('cf'); c.style.display='block';
  c.width=window.innerWidth; c.height=window.innerHeight;
  var ctx=c.getContext('2d');
  var cols=['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#FF9F43'];
  var p=[];
  for(var i=0;i<90;i++) p.push({x:Math.random()*c.width,y:Math.random()*-200,r:Math.random()*9+4,color:cols[Math.floor(Math.random()*cols.length)],vx:(Math.random()-.5)*5,vy:Math.random()*5+2,rot:Math.random()*360,vrot:(Math.random()-.5)*12});
  if(cfF) cancelAnimationFrame(cfF);
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    p.forEach(function(q){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot*Math.PI/180);ctx.fillStyle=q.color;ctx.fillRect(-q.r/2,-q.r/2,q.r,q.r);ctx.restore();q.x+=q.vx;q.y+=q.vy;q.rot+=q.vrot;if(q.y>c.height){q.y=-20;q.x=Math.random()*c.width;}});
    cfF=requestAnimationFrame(draw);
  }
  draw();
  setTimeout(function(){cancelAnimationFrame(cfF);c.style.display='none';},3200);
}

function showCrown(name, cb){
  var el=document.getElementById('crown'); el.style.display='flex';
  var emojis=['🎾','🔥','💪','🏆','🥇'];
  var ems=emojis.map(function(e,i){return '<span style="font-size:28px;animation:pop 0.3s '+i*0.1+'s both">'+e+'</span>';}).join('');
  el.innerHTML='<div style="font-size:86px;animation:bounce 0.45s infinite alternate">👑</div><div style="color:#FFD700;font-size:28px;font-weight:800;margin-top:14px">'+name+'</div><div style="color:#fff;font-size:18px;margin-top:6px;letter-spacing:2px">IS THE KING!</div><div style="margin-top:16px;display:flex;gap:10px">'+ems+'</div><div style="color:#666;font-size:13px;margin-top:18px">stepping off court...</div>';
  showCf();
  setTimeout(function(){el.style.display='none';if(cb)cb();},2800);
}

function showConfirm(msg, onYes){
  var el=document.getElementById('confirm'); el.style.display='flex';
  el.innerHTML='<div class="mbox" style="text-align:center"><div style="font-size:15px;color:#f0f0f0;margin-bottom:20px;line-height:1.5">'+msg+'</div><div style="display:flex;gap:8px"><button class="btn" onclick="document.getElementById(\'confirm\').style.display=\'none\'" style="flex:1;padding:11px;border-radius:8px;border:1px solid #3e3e5e;background:transparent;color:#888;font-size:14px">Cancel</button><button class="btn" id="cy" style="flex:1;padding:11px;border-radius:8px;border:none;background:#E24B4A;color:#fff;font-weight:700;font-size:14px">Yes</button></div></div>';
  document.getElementById('cy').onclick=function(){el.style.display='none';onYes();};
}

function go(name){
  ['home','setup','session','history','stats','players'].forEach(function(s){document.getElementById('s-'+s).style.display='none';});
  document.getElementById('s-'+name).style.display='block';
  ['home','history','stats','players'].forEach(function(s){var t=document.getElementById('t-'+s);if(t)t.classList.toggle('on',s===name);});
  G.screen=name;
  if(name==='home') rHome();
  else if(name==='setup') rSetup();
  else if(name==='session') rSession();
  else if(name==='history') rHistory();
  else if(name==='stats'){G.statP=null;G.stab='singles';rStats();}
  else if(name==='players') rPlayers();
}

function rHome(){
  var el=document.getElementById('s-home');
  var a=ast();
  var kP=Object.keys(a).sort(function(x,y){return (a[y].kings||0)-(a[x].kings||0);});
  var nP=Object.keys(a).filter(function(p){return (a[p].sW||0)+(a[p].sL||0)>0;}).sort(function(x,y){
    var tx=(a[x].sW||0)+(a[x].sL||0), ty=(a[y].sW||0)+(a[y].sL||0);
    return (a[y].sW/ty)-(a[x].sW/tx);
  });
  var medals=['👑','🥈','🥉'];
  var kB=kP.length===0?'<div style="color:#666;font-size:13px;text-align:center;padding:16px">No sessions yet</div>':kP.map(function(p,i){
    var st=a[p], tot=(st.sW||0)+(st.sL||0), pct=tot>0?Math.round(100*st.sW/tot):0;
    return '<div style="display:flex;align-items:center;padding:10px 14px;background:#1e1e2e;border:1px solid #2e2e4e;border-radius:12px;margin-bottom:6px"><span style="font-size:18px;margin-right:10px;width:26px">'+(medals[i]||'')+'</span><div style="flex:1"><div style="font-weight:600;font-size:14px">'+p+'</div><div style="font-size:11px;color:#888;margin-top:1px">'+pct+'% singles win rate</div></div><div style="text-align:right"><div style="font-size:22px;font-weight:800;color:#FFD700;line-height:1">'+st.kings+'</div><div style="font-size:10px;color:#888">kings</div></div></div>';
  }).join('');
  var nB=nP.length===0?'<div style="color:#666;font-size:13px;text-align:center;padding:16px">No normal sessions yet</div>':nP.map(function(p,i){
    var st=a[p], tot=(st.sW||0)+(st.sL||0), pct=tot>0?Math.round(100*st.sW/tot):0, dtot=(st.dW||0)+(st.dL||0), dpct=dtot>0?Math.round(100*st.dW/dtot):0;
    return '<div style="display:flex;align-items:center;padding:10px 14px;background:#1e1e2e;border:1px solid #2e2e4e;border-radius:12px;margin-bottom:6px"><span style="font-size:18px;margin-right:10px;width:26px">'+(medals[i]||'')+'</span><div style="flex:1"><div style="font-weight:600;font-size:14px">'+p+'</div><div style="font-size:11px;color:#888;margin-top:1px">Singles: '+st.sW+'W '+st.sL+'L'+(dtot>0?' · Doubles: '+st.dW+'W '+st.dL+'L':'')+'</div></div><div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#4ECDC4;line-height:1">'+pct+'%</div><div style="font-size:10px;color:#888">singles</div>'+(dtot>0?'<div style="font-size:10px;color:#FF9F43;font-weight:600">'+dpct+'% dbls</div>':'')+'</div></div>';
  }).join('');
  var last='';
  if(G.sessions.length>0){
    var s0=G.sessions[0];
    var w0={}; s0.players.forEach(function(p){w0[p]=0;});
    (s0.matches||[]).forEach(function(m){
      if(m.type==='doubles'){(m.winTeam==='A'?m.tA:m.tB).forEach(function(p){w0[p]=(w0[p]||0)+1;});}
      else w0[m.winner]=(w0[m.winner]||0)+1;
    });
    last='<div style="margin-top:14px;background:#1e1e2e;border-radius:10px;padding:12px"><div class="label">LAST · '+s0.date+' · '+(s0.mode==='king'?'👑 King':'🎾 Normal')+' · by '+s0.loggedBy+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+s0.players.map(function(p){var val=s0.mode==='king'?(s0.kings[p]||0)+'👑':w0[p]+'W';return '<div style="background:#2a2a3e;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px">'+p+'</span><span style="font-size:13px;font-weight:700;color:'+(s0.mode==='king'?'#FFD700':'#4ECDC4')+'">'+val+'</span></div>';}).join('')+'</div></div>';
  }
  el.innerHTML='<div class="seg"><button class="sb '+(G.htab==='kings'?'on':'')+'" onclick="G.htab=\'kings\';rHome()">👑 Kings</button><button class="sb '+(G.htab==='normal'?'on':'')+'" onclick="G.htab=\'normal\';rHome()">🎾 Normal Mode</button></div>'+(G.htab==='kings'?kB:nB)+'<button class="btn" onclick="go(\'setup\')" style="width:100%;padding:16px;font-size:16px;font-weight:800;border-radius:14px;background:#1a1a2e;border:2px solid #FFD700;color:#FFD700;margin-top:14px">🎾 Start New Session</button>'+last;
}

function rSetup(){
  var el=document.getElementById('s-setup');
  var isK=G.mode==='king';
  var pList=G.allPlayers.map(function(p){
    var on=G.activePlayers.indexOf(p)>=0;
    return '<div class="pchk" onclick="togAct(\''+p+'\')"><span style="font-weight:500;font-size:14px">'+p+'</span><div style="width:22px;height:22px;border-radius:6px;border:2px solid '+(on?'#4ECDC4':'#3e3e5e')+';background:'+(on?'#4ECDC4':'transparent')+';display:flex;align-items:center;justify-content:center;font-size:13px;color:#0f0f1a">'+(on?'✓':'')+'</div></div>';
  }).join('');
  var logBtns=G.activePlayers.map(function(p){var on=G.loggedBy===p;return '<button class="btn chip" onclick="G.loggedBy=\''+p+'\';rSetup()" style="'+(on?'border:2px solid #4ECDC4;color:#4ECDC4;background:#0f0f1a;':'')+'">'+p+'</button>';}).join('');
  var thrBtns=[2,3].map(function(n){var on=G.thresh===n;return '<button class="btn" onclick="G.thresh='+n+';rSetup()" style="flex:1;padding:12px;border-radius:10px;border:'+(on?'2px solid #FFD700':'1px solid #3e3e5e')+';background:'+(on?'#0f0f1a':'#2a2a3e')+';color:'+(on?'#FFD700':'#f0f0f0')+';font-weight:700;font-size:15px">'+n+' wins = 👑</button>';}).join('');
  var amtBtns=[0,10,20,30].map(function(n){var on=G.amt===n;return '<button class="btn" onclick="G.amt='+n+';rSetup()" style="flex:1;padding:11px 4px;border-radius:10px;border:'+(on?'2px solid #4ECDC4':'1px solid #3e3e5e')+';background:'+(on?'#0f0f1a':'#2a2a3e')+';color:'+(on?'#4ECDC4':'#f0f0f0')+';font-weight:700;font-size:13px">'+(n===0?'No $':'RM'+n)+'</button>';}).join('');
  var fmtBtns=['Set','TB','STB'].map(function(f){var on=G.fmt===f;return '<button class="btn" onclick="G.fmt=\''+f+'\';rSetup()" style="flex:1;padding:10px 4px;border-radius:10px;border:'+(on?'2px solid '+FC[f]:'1px solid #3e3e5e')+';background:'+(on?'#0f0f1a':'#2a2a3e')+';color:'+(on?FC[f]:'#f0f0f0')+';font-weight:700;font-size:11px">'+FL[f]+'</button>';}).join('');
  el.innerHTML='<div style="font-size:16px;font-weight:700;margin-bottom:14px">⚙️ Session Setup</div>'
  +'<div class="card"><div class="label">SESSION MODE</div><div style="display:flex;gap:8px">'
  +'<button class="btn" onclick="G.mode=\'king\';rSetup()" style="flex:1;padding:14px 8px;border-radius:12px;border:'+(isK?'2px solid #FFD700':'1px solid #3e3e5e')+';background:'+(isK?'#0f0f1a':'#2a2a3e')+';font-weight:800;font-size:14px;color:'+(isK?'#FFD700':'#888')+'">👑 King Mode<div style="font-size:10px;font-weight:400;margin-top:3px;opacity:0.8">Queue · Streaks · Crown</div></button>'
  +'<button class="btn" onclick="G.mode=\'normal\';rSetup()" style="flex:1;padding:14px 8px;border-radius:12px;border:'+(!isK?'2px solid #4ECDC4':'1px solid #3e3e5e')+';background:'+(!isK?'#0f0f1a':'#2a2a3e')+';font-weight:800;font-size:14px;color:'+(!isK?'#4ECDC4':'#888')+'">🎾 Normal<div style="font-size:10px;font-weight:400;margin-top:3px;opacity:0.8">Singles &amp; Doubles</div></button>'
  +'</div></div>'
  +'<div class="card"><div class="label">ACTIVE PLAYERS</div>'+pList+'<button class="btn" onclick="go(\'players\')" style="width:100%;margin-top:10px;padding:8px;border-radius:8px;border:1px dashed #3e3e5e;background:transparent;color:#888;font-size:13px">+ Manage Players</button></div>'
  +'<div class="card"><div class="label">LOGGED BY</div><div style="display:flex;flex-wrap:wrap;gap:8px">'+logBtns+'</div></div>'

  if(m.type==='doubles'){
    var wtBtns=['A','B'].map(function(t){var on=G.eWinT===t,team=t==='A'?m.tA:m.tB;return '<button class="btn" onclick="G.eWinT=\''+t+'\';rLE()" style="flex:1;padding:10px;border-radius:10px;border:'+(on?'2px solid #FFD700':'1px solid #3e3e5e')+';background:'+(on?'#0f0f1a':'#2a2a3e')+';color:'+(on?'#FFD700':'#f0f0f0')+';font-weight:700;font-size:12px">'+(on?'🏆 ':'')+team.join(' & ')+'</button>';}).join('');
    body='<div style="font-weight:700;font-size:15px;margin-bottom:14px;text-align:center">Edit Doubles</div><div class="label">WINNING TEAM</div><div style="display:flex;gap:8px;margin-bottom:14px">'+wtBtns+'</div>';
  } else {
    var wBtns=[m.p1,m.p2].map(function(p){var on=G.eW===p;return '<button class="btn" onclick="G.eW=\''+p+'\';rLE()" style="flex:1;padding:10px;border-radius:10px;border:'+(on?'2px solid #FFD700':'1px solid #3e3e5e')+';background:'+(on?'#0f0f1a':'#2a2a3e')+';color:'+(on?'#FFD700':'#f0f0f0')+';font-weight:700;font-size:14px">'+p+'</button>';}).join('');
    body='<div style="font-weight:700;font-size:15px;margin-bottom:4px;text-align:center">Edit Match</div><div style="font-size:13px;color:#888;margin-bottom:14px;text-align:center">'+m.p1+' vs '+m.p2+'</div><div class="label">WINNER</div><div style="display:flex;gap:8px;margin-bottom:14px">'+wBtns+'</div>';
  }
  var sc1lbl=m.type==='doubles'?'Team A':m.p1, sc2lbl=m.type==='doubles'?'Team B':m.p2;
  body+='<div style="display:flex;gap:6px;margin-bottom:14px;justify-content:center">'+fBtns+'</div><div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px"><div style="text-align:center"><div style="font-size:11px;color:#888;margin-bottom:4px">'+sc1lbl+'</div><input class="inp" type="number" style="width:60px;text-align:center;font-size:24px;font-weight:800;padding:6px 4px" value="'+G.eSc1+'" oninput="G.eSc1=this.value" placeholder="0"/></div><div style="font-size:20px;font-weight:700;color:#444;padding-top:20px">–</div><div style="text-align:center"><div style="font-size:11px;color:#888;margin-bottom:4px">'+sc2lbl+'</div><input class="inp" type="number" style="width:60px;text-align:center;font-size:24px;font-weight:800;padding:6px 4px" value="'+G.eSc2+'" oninput="G.eSc2=this.value" placeholder="0"/></div></div>';
  el.innerHTML='<div class="mbox">'+body+'<div style="display:flex;gap:8px"><button class="btn" onclick="document.getElementById(\'eModal\').style.display=\'none\'" style="flex:1;padding:10px;border-radius:8px;border:1px solid #3e3e5e;background:transparent;color:#888;font-size:14px">Cancel</button><button class="btn" onclick="subLE()" style="flex:1;padding:10px;border-radius:8px;border:none;background:#FFD700;color:#0f0f1a;font-weight:800;font-size:14px">Update ✓</button></div></div>';
}
function subLE(){
  showConfirm('Update this match?',function(){
    document.getElementById('eModal').style.display='none';
    var s=G.session, m=s.matches[G.ei];
    var sc1=parseInt(G.eSc1)||0, sc2=parseInt(G.eSc2)||0;
    if(m.type==='doubles'){s.matches[G.ei]=Object.assign({},m,{winTeam:G.eWinT,score1:sc1,score2:sc2,fmt:G.eFmt});}
    else{var w=G.eW,l=[m.p1,m.p2].find(function(p){return p!==w;});s.matches[G.ei]=Object.assign({},m,{winner:w,loser:l,score1:w===m.p1?sc1:sc2,score2:w===m.p1?sc2:sc1,fmt:G.eFmt});}
    if(s.mode==='king'){var sing=s.matches.filter(function(x){return x.type!=='doubles';});var r=rebuild(s.players,sing,s.thresh);Object.assign(s,r);}
    G.session=s; svL(); rSession();
  });
}

function endSess(){
  var s=G.session;
  var kings=s.mode==='king'?s.kings:Object.fromEntries(s.players.map(function(p){return [p,0];}));
  G.sessions.unshift({date:s.date,players:s.players,mode:s.mode,thresh:s.thresh||0,amt:s.amt||0,fmt:s.fmt,loggedBy:s.loggedBy,matches:s.matches,kings:kings});
  sv(); G.session=null; clL(); go('home');
}

function rHistory(){
  var el=document.getElementById('s-history');
  if(G.sessions.length===0){el.innerHTML='<div style="text-align:center;color:#666;margin-top:44px;font-size:14px">No sessions yet.</div>';return;}
  el.innerHTML='<div style="font-size:16px;font-weight:700;margin-bottom:14px">📅 Session History</div>'+G.sessions.map(function(s,si){
    var isK=s.mode==='king';
    var stl=settle(s.kings,s.players,s.amt);
    var wins={}; s.players.forEach(function(p){wins[p]=0;});
    (s.matches||[]).forEach(function(m){if(m.type==='doubles'){(m.winTeam==='A'?m.tA:m.tB).forEach(function(p){wins[p]=(wins[p]||0)+1;});}else wins[m.winner]=(wins[m.winner]||0)+1;});
    var topP=s.players.reduce(function(a,b){return (isK?(s.kings[b]||0):(wins[b]||0))>(isK?(s.kings[a]||0):(wins[a]||0))?b:a;},s.players[0]);
    var stHtml=stl.length>0?'<div style="border-top:1px solid #2e2e4e;padding-top:10px;margin-bottom:10px"><div class="label">💰 SETTLEMENT</div>'+stl.map(function(t){return '<div style="font-size:13px;margin-bottom:3px"><span style="color:#E24B4A;font-weight:600">'+t.from+'</span> → <span style="color:#4ECDC4;font-weight:600">'+t.to+'</span> <span style="font-weight:700">RM'+t.amount+'</span></div>';}).join('')+'</div>':'';
    var mHtml=(s.matches||[]).length>0?'<div><div class="label">MATCHES — tap to edit</div>'+(s.matches||[]).map(function(m,mi){return '<div class="mrow" onclick="openPE('+si+','+mi+')">'+mDesc(m)+'<span style="font-size:9px;background:#2a2a3e;padding:1px 4px;border-radius:4px;margin-left:4px;color:#888">'+m.fmt+(m.type==='doubles'?' 2v2':'')+'</span><span style="font-size:10px;margin-left:4px">✏️</span></div>';}).join('')+'</div>':'';
    var grid=s.players.map(function(p){var val=isK?(s.kings[p]||0)+'👑':wins[p]+'W';return '<div style="display:flex;align-items:center;justify-content:space-between;background:#2a2a3e;border-radius:8px;padding:8px 10px"><span style="font-size:13px;font-weight:'+(p===topP?700:400)+'">'+p+(p===topP?' ⭐':'')+'</span><span style="font-size:14px;font-weight:700;color:'+(isK?'#FFD700':'#4ECDC4')+'">'+val+'</span></div>';}).join('');
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><div style="font-weight:700;font-size:15px">'+s.date+' <span style="font-size:11px;padding:2px 8px;border-radius:6px;background:'+(isK?'#2a2010':'#0a2a2a')+';color:'+(isK?'#FFD700':'#4ECDC4')+'">'+(isK?'👑 King':'🎾 Normal')+'</span></div><div style="font-size:11px;color:#888;margin-top:2px">by '+s.loggedBy+' · '+(s.matches||[]).length+' matches</div></div><button class="btn" onclick="delSess('+si+')" style="background:none;border:none;color:#E24B4A;font-size:22px;padding:4px">🗑️</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">'+grid+'</div>'+stHtml+mHtml+'</div>';
  }).join('');
}

function delSess(i){showConfirm('Delete this session?',function(){G.sessions.splice(i,1);sv();rHistory();});}

function openPE(si,mi){
  var m=G.sessions[si].matches[mi];
  G.ei={si:si,mi:mi}; G.eFmt=m.fmt||'STB';
  if(m.type==='doubles'){G.eWinT=m.winTeam;G.eSc1=String(m.score1);G.eSc2=String(m.score2);G.mtype='doubles';}
  else{G.eW=m.winner;G.eSc1=String(m.winner===m.p1?m.score1:m.score2);G.eSc2=String(m.winner===m.p1?m.score2:m.score1);G.mtype='singles';}
  rPE();
}
function rPE(){
  var ei=G.ei, m=G.sessions[ei.si].matches[ei.mi];
  var el=document.getElementById('eModal'); el.style.display='flex';
  var fBtns=['Set','TB','STB'].map(function(f){var on=G.eFmt===f;return '<button class="btn" onclick="G.eFmt=\''+f+'\';rPE()" style="padding:6px 10px;border-radius:8px;border:'+(on?'2px solid '+FC[f]:'1px solid #3e3e5e')+';background:'+(on?'#0f0f1a':'#2a2a3e')+';color:'+(on?FC[f]:'#888')+';font-size:11px;font-weight:'+(on?700:400)+'">'+FL[f]+'</button>';}).join('');
  var body='';
  if(m.type==='doubles'){
    var wtBtns=['A','B'].map(function(t){var on=G.eWinT===t,team=t==='A'?m.tA:m.tB;return '<button class="btn" onclick="G.eWinT=\''+t+'\';rPE()" style="flex:1;padding:10px;border-radius:10px;border:'+(on?'2px solid #FFD700':'1px solid #3e3e5e')+';background:'+(on?'#0f0f1a':'#2a2a3e')+';color:'+(on?'#FFD700':'#f0f0f0')+';font-weight:700;font-size:12px">'+(on?'🏆 ':'')+team.join(' & ')+'</button>';}).join('');
    body='<div style="font-weight:700;font-size:15px;margin-bottom:14px;text-align:center">Edit Past Doubles</div><div class="label">WINNING TEAM</div><div style="display:flex;gap:8px;margin-bottom:14px">'+wtBtns+'</div>';
  } else {
    var wBtns=[m.p1,m.p2].map(function(p){var on=G.eW===p;return '<button class="btn" onclick="G.eW=\''+p+'\';rPE()" style="flex:1;padding:10px;border-radius:10px;border:'+(on?'2px solid #FFD700':'1px solid #3e3e5e')+';background:'+(on?'#0f0f1a':'#2a2a3e')+';color:'+(on?'#FFD700':'#f0f0f0')+';font-weight:700;font-size:14px">'+p+'</button>';}).join('');
    body='<div style="font-weight:700;font-size:15px;margin-bottom:4px;text-align:center">Edit Past Match</div><div style="font-size:13px;color:#888;margin-bottom:14px;text-align:center">'+m.p1+' vs '+m.p2+'</div><div class="label">WINNER</div><div style="display:flex;gap:8px;margin-bottom:14px">'+wBtns+'</div>';
  }
  var sc1lbl=m.type==='doubles'?'Team A':m.p1, sc2lbl=m.type==='doubles'?'Team B':m.p2;
  body+='<div style="display:flex;gap:6px;margin-bottom:14px;justify-content:center">'+fBtns+'</div><div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px"><div style="text-align:center"><div style="font-size:11px;color:#888;margin-bottom:4px">'+sc1lbl+'</div><input class="inp" type="number" style="width:60px;text-align:center;font-size:24px;font-weight:800;padding:6px 4px" value="'+G.eSc1+'" oninput="G.eSc1=this.value" placeholder="0"/></div><div style="font-size:20px;font-weight:700;color:#444;padding-top:20px">–</div><div style="text-align:center"><div style="font-size:11px;color:#888;margin-bottom:4px">'+sc2lbl+'</div><input class="inp" type="number" style="width:60px;text-align:center;font-size:24px;font-weight:800;padding:6px 4px" value="'+G.eSc2+'" oninput="G.eSc2=this.value" placeholder="0"/></div></div>';
  el.innerHTML='<div class="mbox">'+body+'<div style="display:flex;gap:8px"><button class="btn" onclick="document.getElementById(\'eModal\').style.display=\'none\'" style="flex:1;padding:10px;border-radius:8px;border:1px solid #3e3e5e;background:transparent;color:#888;font-size:14px">Cancel</button><button class="btn" onclick="subPE()" style="flex:1;padding:10px;border-radius:8px;border:none;background:#FFD700;color:#0f0f1a;font-weight:800;font-size:14px">Update ✓</button></div></div>';
}
function subPE(){
  showConfirm('Update this match?',function(){
    document.getElementById('eModal').style.display='none';
    var ei=G.ei, sess=G.sessions[ei.si], m=sess.matches[ei.mi];
    var sc1=parseInt(G.eSc1)||0, sc2=parseInt(G.eSc2)||0;
    if(m.type==='doubles'){sess.matches[ei.mi]=Object.assign({},m,{winTeam:G.eWinT,score1:sc1,score2:sc2,fmt:G.eFmt});}
    else{var w=G.eW,l=[m.p1,m.p2].find(function(p){return p!==w;});sess.matches[ei.mi]=Object.assign({},m,{winner:w,loser:l,score1:w===m.p1?sc1:sc2,score2:w===m.p1?sc2:sc1,fmt:G.eFmt});}
    if(sess.mode==='king'){var sing=sess.matches.filter(function(x){return x.type!=='doubles';});var r=rebuild(sess.players,sing,sess.thresh);sess.kings=r.kings;}
    sv(); rHistory();
  });
}

function rStats(){
  var el=document.getElementById('s-stats');
  var a=ast();
  var players=Object.keys(a).sort(function(x,y){return (a[y].kings||0)-(a[x].kings||0);});
  if(!G.statP){
    if(players.length===0){el.innerHTML='<div style="text-align:center;color:#666;margin-top:44px;font-size:14px">Play some sessions first!</div>';return;}
    var medals=['👑','🥈','🥉'];
    el.innerHTML='<div style="font-size:16px;font-weight:700;margin-bottom:14px">📊 Player Stats</div>'+players.map(function(p,i){
      var st=a[p], tot=(st.sW||0)+(st.sL||0), pct=tot>0?Math.round(100*st.sW/tot):0, dtot=(st.dW||0)+(st.dL||0), dpct=dtot>0?Math.round(100*st.dW/dtot):0;
      return '<button class="btn" onclick="G.statP=\''+p+'\';G.stab=\'singles\';rStats()" style="width:100%;display:flex;align-items:center;background:#1e1e2e;border:1px solid #2e2e4e;border-radius:12px;padding:13px 14px;margin-bottom:8px;text-align:left"><span style="font-size:20px;margin-right:12px">'+(medals[i]||'')+'</span><div style="flex:1"><div style="font-weight:600;font-size:15px;color:#f0f0f0">'+p+'</div><div style="font-size:11px;color:#888;margin-top:2px">Singles: '+st.sW+'W '+st.sL+'L · '+pct+'%'+(dtot>0?' · Dbls: '+dpct+'%':'')+'</div></div><div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#FFD700;line-height:1">'+st.kings+'👑</div><div style="font-size:11px;color:#4ECDC4;font-weight:600">'+pct+'%</div></div></button>';
    }).join('');
  } else {
    var p=G.statP, st=a[p]||{kings:0,sW:0,sL:0,sPf:0,sPa:0,dW:0,dL:0,h2h:{},pairs:{}};
    var stot=(st.sW||0)+(st.sL||0), spct=stot>0?Math.round(100*st.sW/stot):0;
    var dtot=(st.dW||0)+(st.dL||0), dpct=dtot>0?Math.round(100*st.dW/dtot):0;
    var rivals=Object.keys(st.h2h||{});
    var pairs=Object.keys(st.pairs||{});
    var singTab=G.stab==='singles';
    el.innerHTML='<button class="btn" onclick="G.statP=null;rStats()" style="background:none;border:none;color:#888;font-size:13px;margin-bottom:12px;padding:0">← All Players</button>'
    +'<div style="background:#0f0f1a;border:1px solid #2e2e4e;border-radius:16px;padding:20px;margin-bottom:14px;text-align:center"><div style="font-size:48px;margin-bottom:6px;animation:kingPop 0.5s both">👑</div><div style="font-size:24px;font-weight:800;color:#FFD700;margin-bottom:10px">'+p+'</div><div style="display:flex;justify-content:center;gap:16px"><div style="text-align:center"><div style="font-size:20px;font-weight:800;color:#FFD700">'+st.kings+'</div><div style="font-size:10px;color:#888">KINGS</div></div><div style="text-align:center"><div style="font-size:20px;font-weight:800;color:#4ECDC4">'+spct+'%</div><div style="font-size:10px;color:#888">SINGLES</div></div><div style="text-align:center"><div style="font-size:20px;font-weight:800;color:#FF9F43">'+dpct+'%</div><div style="font-size:10px;color:#888">DOUBLES</div></div><div style="text-align:center"><div style="font-size:20px;font-weight:800;color:#f0f0f0">'+(stot+dtot)+'</div><div style="font-size:10px;color:#888">TOTAL</div></div></div></div>'
    +'<div class="seg"><button class="sb '+(singTab?'on':'')+'" onclick="G.stab=\'singles\';rStats()">🎾 Singles</button><button class="sb '+(!singTab?'on':'')+'" onclick="G.stab=\'doubles\';rStats()">🤝 Doubles</button></div>'
    +(singTab
      ?'<div class="label">HEAD-TO-HEAD (SINGLES)</div>'+(rivals.length===0?'<div style="color:#666;font-size:13px;text-align:center;margin:16px 0">No singles data yet.</div>':rivals.map(function(opp){var h=st.h2h[opp],htot=(h.w||0)+(h.l||0),hpct=htot>0?Math.round(100*h.w/htot):0,dom=hpct>=60?'<span style="background:#FF6B6B;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;margin-left:6px">DOMINANT 🔥</span>':'';return '<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-weight:600;font-size:14px">'+p+' vs '+opp+'</div>'+dom+'</div><div style="height:7px;border-radius:4px;background:#2a2a3e;overflow:hidden;margin-bottom:6px"><div style="height:100%;width:'+hpct+'%;background:#4ECDC4;border-radius:4px;transition:width 0.7s"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#888"><span style="color:#4ECDC4;font-weight:700">'+h.w+'W '+h.l+'L ('+hpct+'%)</span><span>Pts: '+h.pf+'–'+h.pa+'</span></div></div>';}).join(''))
      :'<div class="label">PARTNERSHIP RECORDS (DOUBLES)</div>'+(pairs.length===0?'<div style="color:#666;font-size:13px;text-align:center;margin:16px 0">No doubles data yet.</div>':pairs.map(function(k){var pr=st.pairs[k],ptot=(pr.w||0)+(pr.l||0),ppct=ptot>0?Math.round(100*pr.w/ptot):0,dom=ppct>=60?'<span style="background:#FF9F43;color:#0f0f1a;font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;margin-left:6px">DREAM TEAM 🤝</span>':'';return '<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-weight:600;font-size:14px">'+p+' &amp; '+pr.partner+'</div>'+dom+'</div><div style="height:7px;border-radius:4px;background:#2a2a3e;overflow:hidden;margin-bottom:6px"><div style="height:100%;width:'+ppct+'%;background:#FF9F43;border-radius:4px;transition:width 0.7s"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#888"><span style="color:#FF9F43;font-weight:700">'+pr.w+'W '+pr.l+'L ('+ppct+'%)</span><span>'+ptot+' matches</span></div></div>';}).join('')));
  }
}

function rPlayers(){
  var el=document.getElementById('s-players');
  el.innerHTML='<div style="font-size:16px;font-weight:700;margin-bottom:14px">👥 Player List</div><div class="card">'+G.allPlayers.map(function(p){return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2e2e4e"><span style="font-weight:500;font-size:14px">'+p+'</span>'+(G.allPlayers.length>2?'<button class="btn" onclick="remP(\''+p+'\')" style="background:none;border:none;color:#E24B4A;font-size:20px;padding:0 4px">×</button>':'')+'</div>';}).join('')+'<div style="display:flex;gap:8px;margin-top:12px"><input class="inp" id="npg" placeholder="New player name" value="'+G.newP+'" oninput="G.newP=this.value" onkeydown="if(event.key===\'Enter\')addP()" style="flex:1"/><button class="btn" onclick="addP()" style="padding:10px 14px;border-radius:8px;border:1px solid #3e3e5e;background:#2a2a3e;color:#f0f0f0;font-size:16px;font-weight:700">+</button></div></div><div style="font-size:12px;color:#666;text-align:center;margin-top:8px">Players are permanent · stats build over time</div>';
}
function addP(){var n=(G.newP||'').trim();if(!n||G.allPlayers.indexOf(n)>=0)return;G.allPlayers.push(n);G.newP='';svP();rPlayers();}
function remP(p){showConfirm('Remove '+p+'? Stats stay in history.',function(){G.allPlayers=G.allPlayers.filter(function(x){return x!==p;});G.activePlayers=G.activePlayers.filter(function(x){return x!==x;});svP();rPlayers();});}

// init
ld();
if(G.session){G.mfmt=G.session.fmt||'STB';go('session');}
else go('home');
</script>
</body>
