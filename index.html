// ── GAME LOGIC ──────────────────────────────────────────────────────────────
function rebuildKingState(players,matches,threshold){
  const streaks=Object.fromEntries(players.map(p=>[p,0]));
  const kings=Object.fromEntries(players.map(p=>[p,0]));
  const queue=[...players];let onCourt=[queue.shift(),queue.shift()];
  for(const m of matches){
    const{winner,loser}=m;
    streaks[loser]=0;streaks[winner]=(streaks[winner]||0)+1;
    let crowned=false;
    if(streaks[winner]>=threshold){kings[winner]=(kings[winner]||0)+1;streaks[winner]=0;crowned=true;}
    queue.push(loser);
    if(crowned){queue.push(winner);onCourt=[queue.shift(),queue.shift()];}
    else onCourt=[winner,queue.shift()];
  }
  return{streaks,kings,queue,onCourt};
}

function pairKey(a,b){return[a,b].sort().join('|');}

function allTimeStats(){
  const stats={};
  const ensure=p=>{if(!stats[p])stats[p]={kings:0,sWins:0,sLosses:0,sPf:0,sPa:0,dWins:0,dLosses:0,h2h:{},partnerships:{}};};
  S.sessions.forEach(s=>{
    s.players.forEach(p=>{ensure(p);if(s.mode==='king')stats[p].kings+=s.kings[p]||0;});
    (s.matches||[]).forEach(m=>{
      if(m.type==='doubles'){
        const winT=m.winTeam==='A'?m.teamA:m.teamB;
        const loseT=m.winTeam==='A'?m.teamB:m.teamA;
        winT.forEach(p=>{ensure(p);stats[p].dWins++;});
        loseT.forEach(p=>{ensure(p);stats[p].dLosses++;});
        // partnership records for winning team
        if(winT.length===2){
          const k=pairKey(winT[0],winT[1]);
          winT.forEach(p=>{ensure(p);if(!stats[p].partnerships[k])stats[p].partnerships[k]={partner:winT.find(x=>x!==p),w:0,l:0};stats[p].partnerships[k].w++;});
        }
        if(loseT.length===2){
          const k=pairKey(loseT[0],loseT[1]);
          loseT.forEach(p=>{ensure(p);if(!stats[p].partnerships[k])stats[p].partnerships[k]={partner:loseT.find(x=>x!==p),w:0,l:0};stats[p].partnerships[k].l++;});
        }
      } else {
        // singles
        const{winner,loser}=m;ensure(winner);ensure(loser);
        stats[winner].sWins++;stats[loser].sLosses++;
        const ws=m.winner===m.p1?m.score1:m.score2,ls=m.winner===m.p1?m.score2:m.score1;
        stats[winner].sPf+=ws;stats[winner].sPa+=ls;stats[loser].sPf+=ls;stats[loser].sPa+=ws;
        if(!stats[winner].h2h[loser])stats[winner].h2h[loser]={w:0,l:0,pf:0,pa:0};
        if(!stats[loser].h2h[winner])stats[loser].h2h[winner]={w:0,l:0,pf:0,pa:0};
        stats[winner].h2h[loser].w++;stats[winner].h2h[loser].pf+=ws;stats[winner].h2h[loser].pa+=ls;
        stats[loser].h2h[winner].l++;stats[loser].h2h[winner].pf+=ls;stats[loser].h2h[winner].pa+=ws;
      }
    });
  });
  return stats;
}

function calcSettlement(kings,players,amt){
  if(!amt)return[];
  const res=[];
  players.forEach(e=>{const ek=kings[e]||0;if(!ek)return;players.forEach(p=>{if(p===e)return;const net=(ek-(kings[p]||0))*amt;if(net>0)res.push({from:p,to:e,amount:net});});});
  const map={};
  res.forEach(r=>{const[a,b]=[r.from,r.to].sort();const k=`${a}|${b}`;if(!map[k])map[k]={a,b,net:0};map[k].net+=r.to===b?r.amount:-r.amount;});
  return Object.values(map).filter(x=>x.net!==0).map(x=>x.net>0?{from:x.a,to:x.b,amount:x.net}:{from:x.b,to:x.a,amount:-x.net});
}

// ── CONFETTI / CROWN ────────────────────────────────────────────────────────
let cfF=null;
function showConfetti(){
  const c=document.getElementById('confetti');c.style.display='block';c.width=window.innerWidth;c.height=window.innerHeight;
  const ctx=c.getContext('2d');
  const p=Array.from({length:90},()=>({x:Math.random()*c.width,y:Math.random()*-200,r:Math.random()*9+4,color:['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#FF9F43'][Math.floor(Math.random()*8)],vx:(Math.random()-.5)*5,vy:Math.random()*5+2,rot:Math.random()*360,vrot:(Math.random()-.5)*12}));
  if(cfF)cancelAnimationFrame(cfF);
  const draw=()=>{ctx.clearRect(0,0,c.width,c.height);p.forEach(q=>{ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot*Math.PI/180);ctx.fillStyle=q.color;ctx.fillRect(-q.r/2,-q.r/2,q.r,q.r);ctx.restore();q.x+=q.vx;q.y+=q.vy;q.rot+=q.vrot;if(q.y>c.height){q.y=-20;q.x=Math.random()*c.width;}});cfF=requestAnimationFrame(draw);};
  draw();setTimeout(()=>{cancelAnimationFrame(cfF);c.style.display='none';},3200);
}
function showCrown(name,cb){
  const el=document.getElementById('crownBurst');el.style.display='flex';
  el.innerHTML=`<div style="font-size:86px;animation:bounce 0.45s infinite alternate">👑</div><div style="color:#FFD700;font-size:28px;font-weight:800;margin-top:14px">${name}</div><div style="color:#fff;font-size:18px;margin-top:6px;letter-spacing:2px">IS THE KING!</div><div style="margin-top:16px;display:flex;gap:10px">${['🎾','🔥','💪','🏆','🥇'].map((e,i)=>`<span style="font-size:28px;animation:pop 0.3s ${i*0.1}s both">${e}</span>`).join('')}</div><div style="color:#666;font-size:13px;margin-top:18px">stepping off court...</div>`;
  showConfetti();setTimeout(()=>{el.style.display='none';if(cb)cb();},2800);
}

// ── SCREENS ──────────────────────────────────────────────────────────────────
function showScreen(name){
  ['home','setup','session','history','stats','players'].forEach(s=>document.getElementById('screen-'+s).style.display='none');
  document.getElementById('screen-'+name).style.display='block';
  ['home','history','stats','players'].forEach(s=>document.getElementById('tab-'+s)?.classList.toggle('active',s===name));
  S.currentScreen=name;
  if(name==='home')renderHome();
  else if(name==='setup')renderSetup();
  else if(name==='session')renderSession();
  else if(name==='history')renderHistory();
  else if(name==='stats'){S.statsPlayer=null;S.statsTab='singles';renderStats();}
  else if(name==='players')renderPlayers();
}

// ── HOME ─────────────────────────────────────────────────────────────────────
function renderHome(){
  const el=document.getElementById('screen-home');
  const ast=allTimeStats();
  const kPlayers=[...Object.keys(ast)].sort((a,b)=>(ast[b].kings||0)-(ast[a].kings||0));
  const sPlayers=[...Object.keys(ast)].filter(p=>(ast[p].sWins||0)+(ast[p].sLosses||0)>0).sort((a,b)=>{const ta=(ast[a].sWins||0)+(ast[a].sLosses||0),tb=(ast[b].sWins||0)+(ast[b].sLosses||0);return(ast[b].sWins/tb)-(ast[a].sWins/ta);});

  const kingBoard=kPlayers.length===0?'<div style="color:#666;font-size:13px;text-align:center;padding:12px">No king sessions yet</div>':kPlayers.map((p,i)=>{
    const st=ast[p],tot=(st.sWins||0)+(st.sLosses||0),wpct=tot>0?Math.round(100*st.sWins/tot):0;
    return`<div style="display:flex;align-items:center;padding:10px 14px;background:#1e1e2e;border:1px solid #2e2e4e;border-radius:12px;margin-bottom:6px"><span style="font-size:18px;margin-right:10px;width:26px">${i===0?'👑':i===1?'🥈':'🥉'}</span><div style="flex:1"><div style="font-weight:600;font-size:14px">${p}</div><div style="font-size:11px;color:#888;margin-top:1px">${wpct}% singles win rate</div></div><div style="text-align:right"><div style="font-size:22px;font-weight:800;color:#FFD700;line-height:1">${st.kings}</div><div style="font-size:10px;color:#888">kings</div></div></div>`;
  }).join('');

  const normalBoard=sPlayers.length===0?'<div style="color:#666;font-size:13px;text-align:center;padding:12px">No normal sessions yet</div>':sPlayers.map((p,i)=>{
    const st=ast[p],tot=(st.sWins||0)+(st.sLosses||0),wpct=tot>0?Math.round(100*st.sWins/tot):0,dtot=(st.dWins||0)+(st.dLosses||0),dwpct=dtot>0?Math.round(100*st.dWins/dtot):0;
    return`<div style="display:flex;align-items:center;padding:10px 14px;background:#1e1e2e;border:1px solid #2e2e4e;border-radius:12px;margin-bottom:6px"><span style="font-size:18px;margin-right:10px;width:26px">${i===0?'🏆':i===1?'🥈':'🥉'}</span><div style="flex:1"><div style="font-weight:600;font-size:14px">${p}</div><div style="font-size:11px;color:#888;margin-top:1px">Singles: ${st.sWins}W ${st.sLosses}L${dtot>0?` · Doubles: ${st.dWins}W ${st.dLosses}L`:''}</div></div><div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#4ECDC4;line-height:1">${wpct}%</div><div style="font-size:10px;color:#888">singles</div>${dtot>0?`<div style="font-size:10px;color:#FF9F43;font-weight:600">${dwpct}% dbls</div>`:''}</div></div>`;
  }).join('');

  const lastSession=S.sessions.length>0?`<div style="margin-top:14px;background:#1e1e2e;border-radius:10px;padding:12px"><div class="label">LAST SESSION · ${S.sessions[0].date} · ${S.sessions[0].mode==='king'?'👑 King':'🎾 Normal'} · by ${S.sessions[0].loggedBy}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${S.sessions[0].players.map(p=>{const wins=(S.sessions[0].matches||[]).filter(m=>m.type==='doubles'?(m.winTeam==='A'?m.teamA:m.teamB).includes(p):m.winner===p).length;const val=S.sessions[0].mode==='king'?(S.sessions[0].kings[p]||0)+'👑':wins+'W';return`<div style="background:#2a2a3e;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px">${p}</span><span style="font-size:13px;font-weight:700;color:${S.sessions[0].mode==='king'?'#FFD700':'#4ECDC4'}">${val}</span></div>`;}).join('')}</div></div>`:'';

  el.innerHTML=`<div class="seg"><button class="seg-btn ${S.homeTab==='kings'?'active':''}" onclick="S.homeTab='kings';renderHome()">👑 Kings</button><button class="seg-btn ${S.homeTab==='normal'?'active':''}" onclick="S.homeTab='normal';renderHome()">🎾 Normal Mode</button></div>${S.homeTab==='kings'?kingBoard:normalBoard}<button class="btn" onclick="showScreen('setup')" style="width:100%;padding:16px;font-size:16px;font-weight:800;border-radius:14px;background:#1a1a2e;border:2px solid #FFD700;color:#FFD700;margin-top:14px">🎾 Start New Session</button>${lastSession}`;
}

    <button class="btn" onclick="showScreen('players')" style="width:100%;margin-top:10px;padding:8px;border-radius:8px;border:1px dashed #3e3e5e;background:transparent;color:#888;font-size:13px">+ Manage Players</button>
  </div>
  <div class="card">
    <div class="label">LOGGED BY</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${S.activePlayers.map(p=>`<button class="btn chip ${S.loggedBy===p?'active':''}" onclick="S.loggedBy='${p}';renderSetup()" style="${S.loggedBy===p?'border-color:#4ECDC4;color:#4ECDC4;background:#0f0f1a;':''}">${p}</button>`).join('')}</div>
  </div>
  ${isKing?`
  <div class="card"><div class="label">KING THRESHOLD</div><div style="display:flex;gap:8px">${[2,3].map(n=>`<button class="btn" onclick="S.kingThreshold=${n};renderSetup()" style="flex:1;padding:12px;border-radius:10px;border:${S.kingThreshold===n?'2px solid #FFD700':'1px solid #3e3e5e'};background:${S.kingThreshold===n?'#0f0f1a':'#2a2a3e'};color:${S.kingThreshold===n?'#FFD700':'#f0f0f0'};font-weight:700;font-size:15px">${n} wins = 👑</button>`).join('')}</div></div>
  <div class="card"><div class="label">COLLECT PER KING</div><div style="display:flex;gap:7px">${[0,10,20,30].map(n=>`<button class="btn" onclick="S.collectAmt=${n};renderSetup()" style="flex:1;padding:11px 4px;border-radius:10px;border:${S.collectAmt===n?'2px solid #4ECDC4':'1px solid #3e3e5e'};background:${S.collectAmt===n?'#0f0f1a':'#2a2a3e'};color:${S.collectAmt===n?'#4ECDC4':'#f0f0f0'};font-weight:700;font-size:13px">${n===0?'No $':'RM'+n}</button>`).join('')}</div></div>`:''}

  <button class="btn" onclick="showScreen('home')" style="width:100%;padding:10px;font-size:13px;border-radius:10px;border:1px solid #3e3e5e;background:transparent;color:#888">Cancel</button>`;
}

function toggleActive(p){
  if(S.activePlayers.includes(p)){if(S.activePlayers.length<=2)return;S.activePlayers=S.activePlayers.filter(x=>x!==p);if(S.loggedBy===p)S.loggedBy=S.activePlayers[0];}
  else{if(S.activePlayers.length>=5)return;S.activePlayers.push(p);}
  renderSetup();
}

function startSession(){
  const minP=S.sessionMode==='king'?3:2;
  if(S.activePlayers.length<minP)return;
  savePlayers();
  const players=[...S.activePlayers];
  if(S.sessionMode==='king'){
    const queue=[...players],p1=queue.shift(),p2=queue.shift();
    S.session={date:new Date().toISOString().slice(0,10),players,mode:'king',kingThreshold:S.kingThreshold,collectAmt:S.collectAmt,defaultFormat:S.defaultFormat,loggedBy:S.loggedBy,queue,onCourt:[p1,p2],matches:[],streaks:Object.fromEntries(players.map(p=>[p,0])),kings:Object.fromEntries(players.map(p=>[p,0]))};
  } else {
    S.session={date:new Date().toISOString().slice(0,10),players,mode:'normal',defaultFormat:S.defaultFormat,loggedBy:S.loggedBy,matches:[]};
  }
  S.matchFormat=S.defaultFormat;
  saveLive();
  showScreen('session');
}

// ── SESSION ───────────────────────────────────────────────────────────────────
function matchDesc(m){
  if(m.type==='doubles'){
    const wt=m.winTeam==='A'?m.teamA:m.teamB,lt=m.winTeam==='A'?m.teamB:m.teamA;
    return`<span style="flex:1;font-weight:600;font-size:12px;color:#f0f0f0">${wt.join(' & ')}</span><span style="color:${FC[m.format]||'#4ECDC4'};font-weight:700;font-size:12px;margin:0 6px">${m.score1}–${m.score2}</span><span style="flex:1;text-align:right;color:#888;font-size:12px">${lt.join(' & ')}</span>`;
  }
  return`<span style="flex:1;font-weight:600;font-size:13px">${m.winner}</span><span style="color:${FC[m.format]||'#4ECDC4'};font-weight:700;font-size:13px;margin:0 8px">${m.score1}–${m.score2}</span><span style="flex:1;text-align:right;color:#888;font-size:13px">${m.loser}</span>`;
}

function renderSession(){
  const s=S.session;if(!s){showScreen('home');return;}
  const el=document.getElementById('screen-session');
  const matchLog=(s.matches||[]).map((m,i)=>`<div class="match-row" onclick="openLiveEdit(${i})">${matchDesc(m)}<span style="font-size:9px;background:#2a2a3e;padding:2px 4px;border-radius:4px;margin-left:4px;color:#888">${m.format}${m.type==='doubles'?' 2v2':''}</span><span style="font-size:10px;margin-left:4px">✏️</span></div>`).join('');

  if(s.mode==='king'){
    el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:13px;font-weight:600">📅 ${s.date} · 👑 King</div><div style="font-size:11px;color:#888">×${s.kingThreshold} · ${s.collectAmt>0?'RM'+s.collectAmt:'No $'} · ${s.loggedBy}</div></div>
    <div style="background:#0f0f1a;border:1px solid #2e2e4e;border-radius:14px;padding:18px;margin-bottom:12px;text-align:center">
      <div class="label" style="margin-bottom:10px">ON COURT</div>
      <div style="display:flex;align-items:center;justify-content:space-evenly;margin-bottom:16px">
        ${s.onCourt.map(p=>`<div style="text-align:center"><div style="font-size:16px;margin-bottom:2px">${'🔥'.repeat(Math.min(s.streaks[p]||0,s.kingThreshold))||'·'}</div><div style="font-weight:800;font-size:18px">${p}</div><div style="font-size:11px;color:#888;margin-top:2px">${s.streaks[p]||0} streak · ${s.kings[p]||0}👑</div></div>`).join('<div style="color:#333;font-size:18px">VS</div>')}
      </div>
      <div style="font-size:11px;color:#888;margin-bottom:8px">Tap winner:</div>
      <div style="display:flex;gap:10px">${s.onCourt.map(p=>`<button class="btn" onclick="openScoreModal('${p}')" style="flex:1;padding:13px 8px;border-radius:10px;border:2px solid #FFD700;background:#FFD700;color:#0f0f1a;font-weight:800;font-size:15px">🏆 ${p}</button>`).join('')}</div>
    </div>
    <div style="background:#1e1e2e;border-radius:10px;padding:12px;margin-bottom:10px"><div class="label">WAITING QUEUE</div><div style="display:flex;gap:7px;flex-wrap:wrap">${s.queue.map((p,i)=>`<div style="background:#2a2a3e;border:1px solid #3e3e5e;border-radius:8px;padding:6px 12px;font-size:13px">${i+1}. ${p} <span style="color:#888;font-size:11px">·${s.kings[p]||0}👑</span></div>`).join('')}</div></div>
    ${s.matches.length>0?`<div style="margin-bottom:10px"><div class="label">MATCH LOG — tap to edit</div>${matchLog}</div>`:''}
    <button class="btn" onclick="showConfirm('End session and save?',confirmEndSession)" style="width:100%;padding:14px;font-size:15px;font-weight:700;border-radius:12px;border:2px solid #E24B4A;background:transparent;color:#E24B4A">🏁 End Session & Save</button>`;
  } else {
    const wins={};s.players.forEach(p=>wins[p]=0);
    (s.matches||[]).forEach(m=>{
      if(m.type==='doubles'){(m.winTeam==='A'?m.teamA:m.teamB).forEach(p=>wins[p]=(wins[p]||0)+1);}
      else wins[m.winner]=(wins[m.winner]||0)+1;
    });
    el.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:13px;font-weight:600">📅 ${s.date} · 🎾 Normal</div><div style="font-size:11px;color:#888">${s.loggedBy}</div></div>

      <div class="label" style="margin-bottom:10px">SCOREBOARD</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">${s.players.map(p=>`<div style="background:#1e1e2e;border-radius:10px;padding:10px;text-align:center"><div style="font-weight:700;font-size:14px">${p}</div><div style="font-size:22px;font-weight:800;color:#4ECDC4;margin-top:4px">${wins[p]||0}W</div></div>`).join('')}</div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="openPickModal('singles')" style="flex:1;padding:12px;border-radius:10px;border:2px solid #4ECDC4;background:#4ECDC4;color:#0f0f1a;font-weight:800;font-size:14px">🎾 Singles</button>
        ${s.players.length>=4?`<button class="btn" onclick="openPickModal('doubles')" style="flex:1;padding:12px;border-radius:10px;border:2px solid #FF9F43;background:#FF9F43;color:#0f0f1a;font-weight:800;font-size:14px">🤝 Doubles</button>`:''}
      </div>
    </div>
    ${s.matches.length>0?`<div style="margin-bottom:10px"><div class="label">MATCH LOG — tap to edit</div>${matchLog}</div>`:''}
    <button class="btn" onclick="showConfirm('End session and save?',confirmEndSession)" style="width:100%;padding:14px;font-size:15px;font-weight:700;border-radius:12px;border:2px solid #E24B4A;background:transparent;color:#E24B4A">🏁 End Session & Save</button>`;
  }
}

// ── SCORE MODAL (King) ────────────────────────────────────────────────────────
function openScoreModal(winner){S.scoreModal=winner;S.sc1='';S.sc2='';S.matchFormat=S.session.defaultFormat;renderScoreModal();}
function renderScoreModal(){
  const s=S.session,w=S.scoreModal;
  const el=document.getElementById('scoreModal');el.style.display='flex';
  el.innerHTML=`<div class="modal-box"><div style="font-weight:700;font-size:16px;margin-bottom:4px;text-align:center">Enter Score</div><div style="font-size:13px;color:#888;margin-bottom:14px;text-align:center">${s.onCourt[0]} vs ${s.onCourt[1]}</div>
  <div style="display:flex;gap:6px;margin-bottom:16px;justify-content:center">${['Set','TB','STB'].map(f=>`<button class="btn" onclick="S.matchFormat='${f}';renderScoreModal()" style="padding:6px 10px;border-radius:8px;border:${S.matchFormat===f?`2px solid ${FC[f]}`:'1px solid #3e3e5e'};background:${S.matchFormat===f?'#0f0f1a':'#2a2a3e'};color:${S.matchFormat===f?FC[f]:'#888'};font-weight:${S.matchFormat===f?700:400};font-size:11px">${FL[f]}</button>`).join('')}</div>
  <div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:20px">${s.onCourt.map(p=>`<div style="text-align:center"><div style="font-size:12px;color:${w===p?'#FFD700':'#888'};margin-bottom:6px;font-weight:600">${p}${w===p?' ✓':''}</div><input class="input" type="number" style="width:64px;text-align:center;font-size:26px;font-weight:800;padding:8px 4px;border-color:${w===p?'#FFD700':'#3e3e5e'}" value="${w===p?S.sc1:S.sc2}" oninput="${w===p?'S.sc1':'S.sc2'}=this.value" placeholder="0"/></div>`).join('<div style="font-size:22px;font-weight:700;color:#444;padding-top:22px">–</div>')}</div>
  <div style="display:flex;gap:8px"><button class="btn" onclick="document.getElementById('scoreModal').style.display='none'" style="flex:1;padding:10px;border-radius:8px;border:1px solid #3e3e5e;background:transparent;color:#888;font-size:14px">Cancel</button><button class="btn" onclick="confirmKingScore()" style="flex:1;padding:10px;border-radius:8px;border:none;background:#FFD700;color:#0f0f1a;font-weight:800;font-size:14px">Confirm ✓</button></div></div>`;
}
function confirmKingScore(){
  document.getElementById('scoreModal').style.display='none';
  const s=S.session,winner=S.scoreModal,loser=s.onCourt.find(p=>p!==winner);
  const p1=s.onCourt[0],p2=s.onCourt[1];
  const wScore=parseInt(S.sc1)||0,lScore=parseInt(S.sc2)||0;
  const score1=winner===p1?wScore:lScore,score2=winner===p1?lScore:wScore;
  const prevKings={...s.kings};
  s.matches.push({type:'singles',p1,p2,winner,loser,score1,score2,format:S.matchFormat});
  const r=rebuildKingState(s.players,s.matches,s.kingThreshold);Object.assign(s,r);S.session=s;
  const crowned=Object.keys(s.kings).find(p=>(s.kings[p]||0)>(prevKings[p]||0));
  saveLive();
  if(crowned)showCrown(crowned,()=>renderSession());else renderSession();
}

// ── PICK MODAL (Normal) ───────────────────────────────────────────────────────
function openPickModal(type){
  S.matchType=type;S.sc1='';S.sc2='';S.matchFormat=S.session.defaultFormat;
  S.pickP1=null;S.pickP2=null;S.teamA=[];S.teamB=[];S.winTeam=null;S.scoreModal=null;
  renderPickModal();
}
function renderPickModal(){
  const s=S.session,el=document.getElementById('pickModal');el.style.display='flex';
  const isSingles=S.matchType==='singles';
  let content='';

  if(isSingles){
    content=`<div style="font-weight:700;font-size:15px;margin-bottom:14px;text-align:center">🎾 Singles Match</div>

    <div class="label">PLAYER 2</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${s.players.filter(p=>p!==S.pickP1).map(p=>`<button class="btn chip ${S.pickP2===p?'active':''}" onclick="S.pickP2='${p}';renderPickModal()" style="${S.pickP2===p?'border-color:#4ECDC4;color:#4ECDC4;background:#0f0f1a;':''}">${p}</button>`).join('')}</div>
    ${S.pickP1&&S.pickP2?`
    <div class="label">FORMAT</div>
    <div style="display:flex;gap:6px;margin-bottom:12px">${['Set','TB','STB'].map(f=>`<button class="btn" onclick="S.matchFormat='${f}';renderPickModal()" style="flex:1;padding:7px 4px;border-radius:8px;border:${S.matchFormat===f?`2px solid ${FC[f]}`:'1px solid #3e3e5e'};background:${S.matchFormat===f?'#0f0f1a':'#2a2a3e'};color:${S.matchFormat===f?FC[f]:'#888'};font-size:11px;font-weight:${S.matchFormat===f?700:400}">${FL[f]}</button>`).join('')}</div>
    <div class="label">WINNER</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">${[S.pickP1,S.pickP2].map(p=>`<button class="btn" onclick="S.scoreModal='${p}';renderPickModal()" style="flex:1;padding:10px;border-radius:10px;border:${S.scoreModal===p?'2px solid #FFD700':'1px solid #3e3e5e'};background:${S.scoreModal===p?'#0f0f1a':'#2a2a3e'};color:${S.scoreModal===p?'#FFD700':'#f0f0f0'};font-weight:700;font-size:13px">${S.scoreModal===p?'🏆 ':''} ${p}</button>`).join('')}</div>
    ${S.scoreModal?`<div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px">${[S.pickP1,S.pickP2].map(p=>`<div style="text-align:center"><div style="font-size:11px;color:#888;margin-bottom:4px">${p}</div><input class="input" type="number" style="width:60px;text-align:center;font-size:24px;font-weight:800;padding:6px 4px;border-color:${S.scoreModal===p?'#FFD700':'#3e3e5e'}" value="${S.scoreModal===p?S.sc1:S.sc2}" oninput="${S.scoreModal===p?'S.sc1':'S.sc2'}=this.value" placeholder="0"/></div>`).join('<div style="font-size:20px;font-weight:700;color:#444;padding-top:20px">–</div>')}</div>`:''}
    `:''}`;
  } else {
    // doubles
    content=`<div style="font-weight:700;font-size:15px;margin-bottom:14px;text-align:center">🤝 Doubles Match</div>
    <div class="label">TEAM A (tap to add, max 2)</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${s.players.map(p=>{const inA=S.teamA.includes(p),inB=S.teamB.includes(p);return`<button class="btn chip ${inA?'active':''}" onclick="toggleTeam('A','${p}')" style="${inA?'border-color:#FFD700;color:#FFD700;background:#0f0f1a;':inB?'opacity:0.3;':''}" ${inB?'disabled':''}>
      ${p}</button>`;}).join('')}</div>
    <div class="label">TEAM B (tap to add, max 2)</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${s.players.map(p=>{const inA=S.teamA.includes(p),inB=S.teamB.includes(p);return`<button class="btn chip ${inB?'active':''}" onclick="toggleTeam('B','${p}')" style="${inB?'border-color:#4ECDC4;color:#4ECDC4;background:#0f0f1a;':inA?'opacity:0.3;':''}" ${inA?'disabled':''}>
      ${p}</button>`;}).join('')}</div>
    ${S.teamA.length===2&&S.teamB.length===2?`
    <div class="label">FORMAT</div>
    <div style="display:flex;gap:6px;margin-bottom:12px">${['Set','TB','STB'].map(f=>`<button class="btn" onclick="S.matchFormat='${f}';renderPickModal()" style="flex:1;padding:7px 4px;border-radius:8px;border:${S.matchFormat===f?`2px solid ${FC[f]}`:'1px solid #3e3e5e'};background:${S.matchFormat===f?'#0f0f1a':'#2a2a3e'};color:${S.matchFormat===f?FC[f]:'#888'};font-size:11px;font-weight:${S.matchFormat===f?700:400}">${FL[f]}</button>`).join('')}</div>
    <div class="label">WINNING TEAM</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn" onclick="S.winTeam='A';renderPickModal()" style="flex:1;padding:10px;border-radius:10px;border:${S.winTeam==='A'?'2px solid #FFD700':'1px solid #3e3e5e'};background:${S.winTeam==='A'?'#0f0f1a':'#2a2a3e'};color:${S.winTeam==='A'?'#FFD700':'#f0f0f0'};font-weight:700;font-size:13px">${S.winTeam==='A'?'🏆 ':''}${S.teamA.join(' & ')}</button>
      <button class="btn" onclick="S.winTeam='B';renderPickModal()" style="flex:1;padding:10px;border-radius:10px;border:${S.winTeam==='B'?'2px solid #FFD700':'1px solid #3e3e5e'};background:${S.winTeam==='B'?'#0f0f1a':'#2a2a3e'};color:${S.winTeam==='B'?'#FFD700':'#f0f0f0'};font-weight:700;font-size:13px">${S.winTeam==='B'?'🏆 ':''}${S.teamB.join(' & ')}</button>
    </div>
    ${S.winTeam?`<div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px">
      <div style="text-align:center"><div style="font-size:11px;color:#888;margin-bottom:4px">Team A</div><input class="input" type="number" style="width:60px;text-align:center;font-size:24px;font-weight:800;padding:6px 4px" value="${S.sc1}" oninput="S.sc1=this.value" placeholder="0"/></div>
      <div style="font-size:20px;font-weight:700;color:#444;padding-top:20px">–</div>
      <div style="text-align:center"><div style="font-size:11px;color:#888;margin-bottom:4px">Team B</div><input class="input" type="number" style="width:60px;text-align:center;font-size:24px;font-weight:800;padding:6px 4px" value="${S.sc2}" oninput="S.sc2=this.value" placeholder="0"/></div>
    </div>`:''}
    `:''}`;
  }

  const canSave=isSingles?(S.pickP1&&S.pickP2&&S.scoreModal):(S.teamA.length===2&&S.teamB.length===2&&S.winTeam);
  el.innerHTML=`<div class="modal-box">${content}<div style="display:flex;gap:8px"><button class="btn" onclick="document.getElementById('pickModal').style.display='none'" style="flex:1;padding:10px;border-radius:8px;border:1px solid #3e3e5e;background:transparent;color:#888;font-size:14px">Cancel</button>${canSave?`<button class="btn" onclick="confirmNormalMatch()" style="flex:1;padding:10px;border-radius:8px;border:none;background:${isSingles?'#4ECDC4':'#FF9F43'};color:#0f0f1a;font-weight:800;font-size:14px">Save ✓</button>`:''}</div></div>`;
}

function toggleTeam(team,p){
  if(team==='A'){if(S.teamA.includes(p))S.teamA=S.teamA.filter(x=>x!==p);else if(S.teamA.length<2)S.teamA.push(p);}
  else{if(S.teamB.includes(p))S.teamB=S.teamB.filter(x=>x!==p);else if(S.teamB.length<2)S.teamB.push(p);}
  renderPickModal();
}

function confirmNormalMatch(){
  document.getElementById('pickModal').style.display='none';
  if(S.matchType==='singles'){
    const winner=S.scoreModal,loser=[S.pickP1,S.pickP2].find(p=>p!==winner);
    const wScore=parseInt(S.sc1)||0,lScore=parseInt(S.sc2)||0;
    const score1=winner===S.pickP1?wScore:lScore,score2=winner===S.pickP1?lScore:wScore;
    S.session.matches.push({type:'singles',p1:S.pickP1,p2:S.pickP2,winner,loser,score1,score2,format:S.matchFormat});
  } else {
    const score1=parseInt(S.sc1)||0,score2=parseInt(S.sc2)||0;
    S.session.matches.push({type:'doubles',teamA:[...S.teamA],teamB:[...S.teamB],winTeam:S.winTeam,score1,score2,format:S.matchFormat});
  }
  saveLive();
  renderSession();
}

function submitLiveEdit(){
  showConfirm('Update this match?',()=>{

    if(m.type==='doubles'){s.matches[idx]={...m,winTeam:S.winTeam,score1:sc1,score2:sc2,format:S.leFormat};}
    else{const winner=S.leWinner,loser=[m.p1,m.p2].find(p=>p!==winner);const score1=winner===m.p1?sc1:sc2,score2=winner===m.p1?sc2:sc1;s.matches[idx]={...m,winner,loser,score1,score2,format:S.leFormat};}

function confirmEndSession(){

// ── HISTORY ───────────────────────────────────────────────────────────────────
function renderHistory(){
  const el=document.getElementById('screen-history');
  if(S.sessions.length===0){el.innerHTML='<div style="text-align:center;color:#666;margin-top:44px;font-size:14px">No sessions yet.</div>';return;}
  el.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:14px">📅 Session History</div>`+
  S.sessions.map((s,sIdx)=>{
    const isKing=s.mode==='king';
    const settlement=isKing?calcSettlement(s.kings,s.players,s.collectAmt):[];
    const wins={};s.players.forEach(p=>wins[p]=0);
    (s.matches||[]).forEach(m=>{if(m.type==='doubles'){(m.winTeam==='A'?m.teamA:m.teamB).forEach(p=>wins[p]=(wins[p]||0)+1);}else wins[m.winner]=(wins[m.winner]||0)+1;});
    const topP=s.players.reduce((a,b)=>(isKing?(s.kings[b]||0):(wins[b]||0))>(isKing?(s.kings[a]||0):(wins[a]||0))?b:a,s.players[0]);
    const settleHTML=settlement.length>0?`<div style="border-top:1px solid #2e2e4e;padding-top:10px;margin-bottom:10px"><div class="label">💰 SETTLEMENT</div>${settlement.map(t=>`<div style="font-size:13px;margin-bottom:3px"><span style="color:#E24B4A;font-weight:600">${t.from}</span> → <span style="color:#4ECDC4;font-weight:600">${t.to}</span> <span style="font-weight:700">RM${t.amount}</span></div>`).join('')}</div>`:'';
    const matchesHTML=(s.matches||[]).length>0?`<div><div class="label">MATCHES — tap to edit</div>${s.matches.map((m,mIdx)=>`<div class="match-row" onclick="openPastEdit(${sIdx},${mIdx})" style="font-size:12px">${matchDesc(m)}<span style="font-size:9px;background:#2a2a3e;padding:1px 4px;border-radius:4px;margin-left:4px;color:#888">${m.format}${m.type==='doubles'?' 2v2':''}</span><span style="font-size:10px;margin-left:4px">✏️</span></div>`).join('')}</div>`:'';
    return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><div style="font-weight:700;font-size:15px">${s.date} <span style="font-size:11px;padding:2px 8px;border-radius:6px;background:${isKing?'#2a2010':'#0a2a2a'};color:${isKing?'#FFD700':'#4ECDC4'}">${isKing?'👑 King':'🎾 Normal'}</span></div><div style="font-size:11px;color:#888;margin-top:2px">by ${s.loggedBy} · ${(s.matches||[]).length} matches</div></div><button class="btn" onclick="deleteSession(${sIdx})" style="background:none;border:none;color:#E24B4A;font-size:22px;padding:4px">🗑️</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">${s.players.map(p=>`<div style="display:flex;align-items:center;justify-content:space-between;background:#2a2a3e;border-radius:8px;padding:8px 10px"><span style="font-size:13px;font-weight:${p===topP?700:400}">${p}${p===topP?' ⭐':''}</span><span style="font-size:14px;font-weight:700;color:${isKing?'#FFD700':'#4ECDC4'}">${isKing?(s.kings[p]||0)+'👑':wins[p]+'W'}</span></div>`).join('')}</div>
    ${settleHTML}${matchesHTML}</div>`;
  }).join('');
}

      const pr=st.partnerships[k],ptot=(pr.w||0)+(pr.l||0),ppct=ptot>0?Math.round(100*pr.w/ptot):0;
      const dom=ppct>=60?'<span style="background:#FF9F43;color:#0f0f1a;font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;margin-left:6px">DREAM TEAM 🤝</span>':'';
      return`<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-weight:600;font-size:14px">${p} & ${pr.partner}</div>${dom}</div><div style="height:7px;border-radius:4px;background:#2a2a3e;overflow:hidden;margin-bottom:6px"><div style="height:100%;width:${ppct}%;background:#FF9F43;border-radius:4px;transition:width 0.7s"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#888"><span style="color:#FF9F43;font-weight:700">${pr.w}W ${pr.l}L (${ppct}%)</span><span>${ptot} matches together</span></div></div>`;
    }).join('')}
    `}`;
  }
}

// ── PLAYERS ───────────────────────────────────────────────────────────────────
function renderPlayers(){
  const el=document.getElementById('screen-players');
  el.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:14px">👥 Player List</div>
  <div class="card">${S.allPlayers.map(p=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2e2e4e"><span style="font-weight:500;font-size:14px">${p}</span>${S.allPlayers.length>2?`<button class="btn" onclick="removeFromAll('${p}')" style="background:none;border:none;color:#E24B4A;font-size:20px;padding:0 4px">×</button>`:''}</div>`).join('')}
  <div style="display:flex;gap:8px;margin-top:12px"><input class="input" id="npg" placeholder="New player name" value="${S.newPlayerInput}" oninput="S.newPlayerInput=this.value" onkeydown="if(event.key==='Enter')addGlobalPlayer()" style="flex:1"/><button class="btn" onclick="addGlobalPlayer()" style="padding:10px 14px;border-radius:8px;border:1px solid #3e3e5e;background:#2a2a3e;color:#f0f0f0;font-size:16px;font-weight:700">+</button></div></div>
  <div style="font-size:12px;color:#666;text-align:center;margin-top:8px">Players are permanent · stats build over time</div>`;
function addGlobalPlayer(){
  const n=(S.newPlayerInput||'').trim();if(!n||S.allPlayers.includes(n))return;
  S.allPlayers.push(n);S.newPlayerInput='';savePlayers();renderPlayers();
}
function removeFromAll(p){
  showConfirm(`Remove ${p}? Their stats stay in history.`,()=>{S.allPlayers=S.allPlayers.filter(x=>x!==p);S.activePlayers=S.activePlayers.filter(x=>x!==p);savePlayers();renderPlayers();});
}

// ── INIT ──────────────────────────────────────────────────────────────────────
load();
// show loading state then try cloud
document.getElementById('screen-home').innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px"><div style="font-size:44px">🎾</div><div style="color:#888;font-size:14px">Syncing from cloud...</div></div>';
showScreen('home');
sbLoad().then(synced=>{
  if(synced){try{localStorage.setItem(SK,JSON.stringify(S.sessions));}catch{}}
  if(S.session){S.matchFormat=S.session.defaultFormat;showScreen('session');}
  else showScreen('home');
});
</script>
